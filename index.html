<style>
:root{--bg:#0a0c12;--panel:#12151f;--line:#262c3d;--ink:#e8ecf6;--dim:#8d96ad;--acc:#7fd6ff;

<body>
<header>
  <button id="bMenu" aria-label="Levels">Levels</button>
  <h1 id="title"></h1>
  <button id="bReset" aria-label="Reset level">Reset</button>
</header>
<div id="stage"><canvas id="cv"></canvas>
  <div id="over"><div class="card" id="card"></div></div>
</div>
<footer>
  <button id="bHint" aria-label="Show a hint">Hint</button>
  <button id="bWave" aria-label="Toggle wave animation">Waves: on</button>
  <button id="bGuide" aria-label="Toggle guides">Guides: on</button>
  <div id="rot" class="grp"><button id="rL" aria-label="Turn left">Turn left</button><button id="rR" aria-label="Turn right">Turn right</button></div>
</footer>
<script>
const W=1000,H=600,NW=40,LG=6;
const WL=[];for(let i=0;i<NW;i++)WL.push(400+300*i/(NW-1));
const ior=wl=>1.35+3e4/(wl*wl);
const D2R=Math.PI/180;
function wlRGB(wl){
  let r=0,g=0,b=0;
  if(wl<440){r=(440-wl)/60;b=1}else if(wl<490){g=(wl-440)/50;b=1}else if(wl<510){g=1;b=(510-wl)/20}
  else if(wl<580){r=(wl-510)/70;g=1}else if(wl<645){r=1;g=(645-wl)/65}else{r=1}
  const f=wl<420?0.3+0.7*(wl-380)/40:1;
  const c=v=>Math.round(255*Math.pow(Math.max(0,v*f),0.8));
  return [c(r),c(g),c(b)];
}
const DISC={pol:1,hwp:1,phase:1};
const DIALS={pol:{step:22.5,mod:180,name:'Axis'},hwp:{step:22.5,mod:180,name:'Axis'},pbs:{step:22.5,mod:180,name:'Axis'},phase:{step:45,mod:360,name:'Phase'}};
function normalize(p){
  p.a=(p.a||0)*D2R;
  const L={mirror:100,split:100,filter:80,lens:110,pbs:90,dichro:100};
  if(L[p.t])p.len=p.len||L[p.t];
  if(p.t==='prism')p.r=p.r||60;
  if(DISC[p.t]){p.r=p.r||30;p.norot=1}
  if(p.t==='goal')p.r=p.r||15;
  if(p.t==='lens'&&p.f===undefined)p.f=160;
  if(DIALS[p.t]&&p.ax===undefined)p.ax=0;
  if(p.t==='emit'||p.t==='filter'||p.t==='goal'||p.t==='dichro')p.band=p.band||[400,700];
  if(p.t==='emit'){p.pol=(p.pol||0);p.nb=p.w?(p.nb||9):1;p.w=p.w||0}
  p.ox=p.x;p.oy=p.y;
  if(p.rail!==undefined&&p.range===undefined)p.range=150;
  return p;
}
function segsOf(p){
  const c=Math.cos(p.a),s=Math.sin(p.a);
  if(p.len&&p.t!=='prism'&&p.t!=='wall'){
    const h=p.len/2;return [{x1:p.x-c*h,y1:p.y-s*h,x2:p.x+c*h,y2:p.y+s*h,k:p.t,p}];
  }
  if(p.t==='prism'){
    const v=[0,1,2].map(k=>{const q=p.a+k*2*Math.PI/3;return [p.x+Math.cos(q)*p.r,p.y+Math.sin(q)*p.r]});
    return [0,1,2].map(k=>({x1:v[k][0],y1:v[k][1],x2:v[(k+1)%3][0],y2:v[(k+1)%3][1],k:'glass',p}));
  }
  if(p.t==='wall'){
    const hw=p.w/2,hh=p.h/2;
    const v=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([u,w])=>[p.x+u*c-w*s,p.y+u*s+w*c]);
    return [0,1,2,3].map(k=>({x1:v[k][0],y1:v[k][1],x2:v[(k+1)%4][0],y2:v[(k+1)%4][1],k:'wall',p}));
  }
  return [];
}
const BOX=[[0,0,W,0],[W,0,W,H],[W,H,0,H],[0,H,0,0]].map(([a,b,c,d])=>({x1:a,y1:b,x2:c,y2:d,k:'wall',p:null}));
function trace(pieces){
  const segs=[],goals=[],emit=[],discs=[];
  for(const p of pieces){
    if(p.t==='goal')goals.push(p);else if(p.t==='emit')emit.push(p);else if(DISC[p.t])discs.push(p);else segs.push(...segsOf(p));
  }
  segs.push(...BOX);
  const st=goals.map(()=>({inc:new Float32Array(NW),re:new Float32Array(NW),im:new Float32Array(NW)}));
  const out=[],stack=[],ev=[];
  let minI=NW;const emitted=[];
  for(const e of emit){
    const dx=Math.cos(e.a),dy=Math.sin(e.a),px=-dy,py=dx;
    for(let i=0;i<NW;i++)if(WL[i]>=e.band[0]&&WL[i]<=e.band[1]){
      minI=Math.min(minI,i);emitted.push(i);
      for(let k=0;k<e.nb;k++){
        const off=e.nb>1?(k/(e.nb-1)-0.5)*e.w:0;
        stack.push({x:e.x+dx*16+px*off,y:e.y+dy*16+py*off,dx,dy,i,I:1/e.nb,K:e.nb,ins:null,d:0,pol:e.pol*D2R,ph:0,vp:0});
      }
    }
  }
  const mk=(r,o)=>Object.assign({x:r.x,y:r.y,dx:r.dx,dy:r.dy,i:r.i,I:r.I,K:r.K,ins:r.ins,d:r.d+1,pol:r.pol,ph:r.ph,vp:r.vp},o);
  let guard=0;
  while(stack.length&&guard++<60000){
    const r=stack.pop();
    if(r.d>30||r.I<0.01)continue;
    let bt=1e9,bs=null,bg=-1,bd=null;
    for(const s of segs){
      const ex=s.x2-s.x1,ey=s.y2-s.y1,den=r.dx*ey-r.dy*ex;
      if(Math.abs(den)<1e-9)continue;
      const qx=s.x1-r.x,qy=s.y1-r.y;
      const t=(qx*ey-qy*ex)/den,u=(qx*r.dy-qy*r.dx)/den;
      if(t>1e-4&&u>=0&&u<=1&&t<bt){bt=t;bs=s;bg=-1;bd=null}
    }
    for(const d of discs){
      const fx=d.x-r.x,fy=d.y-r.y,t=fx*r.dx+fy*r.dy;
      if(t>1e-4&&Math.abs(fx*r.dy-fy*r.dx)<=d.r&&t<bt){bt=t;bd=d;bs=null;bg=-1}
    }
    for(let gi=0;gi<goals.length;gi++){
      const g=goals[gi],fx=r.x-g.x,fy=r.y-g.y;
      const b=fx*r.dx+fy*r.dy,cc=fx*fx+fy*fy-g.r*g.r,disc=b*b-cc;
      if(disc>0){const t=-b-Math.sqrt(disc);if(t>1e-4&&t<bt){bt=t;bs=null;bg=gi;bd=null}}
    }
    const hx=r.x+r.dx*bt,hy=r.y+r.dy*bt;
    const lamg=WL[r.i]/LG;
    const nn=r.ins?ior(WL[r.i]):1,dph=2*Math.PI*bt*nn/lamg;
    const ph=r.ph+dph,vp=r.vp+dph;
    out.push({x1:r.x,y1:r.y,x2:hx,y2:hy,i:r.i,I:r.I,K:r.K,pol:r.pol,vp0:r.vp,ph0:r.ph,n:nn});
    if(bg>=0){const s=st[bg],a=Math.sqrt(r.I);s.inc[r.i]+=r.I;s.re[r.i]+=a*Math.cos(ph);s.im[r.i]+=a*Math.sin(ph);continue}
    if(bd){
      const b2=Object.assign({},r,{x:hx,y:hy,ph,vp}),p=bd;
      if(p.t==='phase')stack.push(mk(b2,{ph:ph+p.ax*D2R}));
      else if(p.t==='pol'){const c=Math.cos(r.pol-p.ax*D2R);stack.push(mk(b2,{I:r.I*c*c,pol:p.ax*D2R}))}
      else stack.push(mk(b2,{pol:2*p.ax*D2R-r.pol}));
      continue;
    }
    if(!bs)continue;
    const k=bs.k,p=bs.p;
    if(k==='wall')continue;
    const base=Object.assign({},r,{x:hx,y:hy,ph,vp});
    if(k==='filter'){
      if(WL[r.i]>=p.band[0]&&WL[r.i]<=p.band[1])stack.push(mk(base,{}));
      continue;
    }
    const sl=Math.hypot(bs.x2-bs.x1,bs.y2-bs.y1),ex=(bs.x2-bs.x1)/sl,ey=(bs.y2-bs.y1)/sl;
    let nx=-ey,ny=ex;
    if(nx*r.dx+ny*r.dy>0){nx=-nx;ny=-ny}
    const dn=r.dx*nx+r.dy*ny;
    const rx=r.dx-2*dn*nx,ry=r.dy-2*dn*ny;
    if(k==='mirror'){stack.push(mk(base,{dx:rx,dy:ry,ph:ph+Math.PI}));continue}
    if(k==='dichro'){
      if(WL[r.i]>=p.band[0]&&WL[r.i]<=p.band[1])stack.push(mk(base,{dx:rx,dy:ry,ph:ph+Math.PI}));
      else stack.push(mk(base,{}));
      continue;
    }
    if(k==='split'){
      stack.push(mk(base,{dx:rx,dy:ry,I:r.I/2,ph:ph+Math.PI/2}));
      stack.push(mk(base,{I:r.I/2}));
      continue;
    }
    if(k==='pbs'){
      const c=Math.cos(r.pol-p.ax*D2R),T=c*c;
      if(T>0.005)stack.push(mk(base,{I:r.I*T,pol:p.ax*D2R}));
      if(1-T>0.005)stack.push(mk(base,{dx:rx,dy:ry,I:r.I*(1-T),pol:p.ax*D2R+Math.PI/2}));
      continue;
    }
    if(k==='lens'){
      const fx=-nx,fy=-ny;
      const dd=r.dx*fx+r.dy*fy,dt=r.dx*ex+r.dy*ey;
      const slope=dt/dd,h=(hx-p.x)*ex+(hy-p.y)*ey;
      const s2=slope-h/p.f;
      let ux=fx+s2*ex,uy=fy+s2*ey;const ul=Math.hypot(ux,uy);ux/=ul;uy/=ul;
      stack.push(mk(base,{dx:ux,dy:uy}));continue;
    }
    if(k==='glass'){
      const n=ior(WL[r.i]);
      const inside=r.ins===p,n1=inside?n:1,n2=inside?1:n,eta=n1/n2;
      const ci=-dn,kk=1-eta*eta*(1-ci*ci);
      if(kk<0){ev.push({x:hx,y:hy,nx,ny,dx:r.dx,dy:r.dy,ox:rx,oy:ry,i:r.i,tir:1});stack.push(mk(base,{dx:rx,dy:ry}))}
      else{
        const f=eta*ci-Math.sqrt(kk),ox=eta*r.dx+f*nx,oy=eta*r.dy+f*ny;
        ev.push({x:hx,y:hy,nx,ny,dx:r.dx,dy:r.dy,ox,oy,i:r.i,tir:0});
        stack.push(mk(base,{dx:ox,dy:oy,ins:inside?null:p}));
      }
    }
  }
  const res=goals.map((g,gi)=>evalGoal(g,st[gi]));
  let refI=minI;for(const i of emitted)if(Math.abs(i-20)<Math.abs(refI-20))refI=i;
  return {rays:out,res,minI,ev,refI};
}
function evalGoal(g,s){
  const bands=g.bands||[g.band],need=g.need||0.2;
  let inN=0,hit=0,outside=0,sum=0,incSum=0;
  for(let i=0;i<NW;i++){
    const w=WL[i];let inb=false;
    for(const b of bands)if(w>=b[0]&&w<=b[1]){inb=true;break}
    const en=g.coh?s.re[i]*s.re[i]+s.im[i]*s.im[i]:s.inc[i];
    if(inb){inN++;sum+=en;incSum+=s.inc[i];if(en>=need)hit++}else outside+=s.inc[i];
  }
  const pct=inN?sum/inN:0;
  if(g.dark){
    const inc=inN?incSum/inN:0;
    return {prog:inc>=0.3?1:0,pct,lit:inc>=0.3&&pct<=0.05,bad:inc>=0.3&&pct>0.05};
  }
  const prog=inN?hit/inN:0;
  return {prog,pct,lit:prog>=0.7&&(!g.ex||outside<=2),bad:!!g.ex&&outside>2};
}

const RED=[620,700],GRN=[520,570],BLU=[420,480],MONO=[595,605];
const DR=[610,700],DB=[400,490];
const CHAPTERS=[
{name:'Basics',intro:''},
{name:'Lenses',intro:'A convex lens bends parallel rays toward a focus 160 units behind it. A concave lens spreads them out. Beams now have width, so a small target needs a focused beam.'},
{name:'Polarization',intro:'Light now has a polarization angle, shown by the small badges. A polarizer passes the part of the light along its axis. A waveplate turns the polarization. A polarizing splitter sends one part straight and the other aside. Select a piece and drag the amber knob on it to set its axis.'},
{name:'Dichroics',intro:'A dichroic mirror reflects one band of colors and lets all the others pass straight through. Unlike a filter, nothing is thrown away.'},
{name:'Interference',intro:'Laser light is a wave. When two beams recombine, they add or cancel depending on how far each traveled. Phase plates delay a beam; drag the amber knob to set the delay. Mirrors on rails slide along the beam. Watch the waves: beams that arrive in step add up, and beams half a wave apart cancel.'}
];
const LEVELS=[
// ---- Chapter 1
{name:'First light',hint:'Drag pieces with a blue ring. Bolted pieces stay put.',
 pieces:[
  {t:'emit',x:100,y:300,a:0,band:RED,fixed:1},
  {t:'mirror',x:400,y:150,a:0},
  {t:'goal',x:700,y:500,band:RED,fixed:1}],
 sol:{1:[700,300,45]}},
{name:'Around the wall',hint:'Two mirrors, one wall in the way.',
 pieces:[
  {t:'emit',x:100,y:500,a:0,band:RED,fixed:1},
  {t:'wall',x:520,y:300,w:30,h:340,a:0,fixed:1},

  {t:'mirror',x:650,y:420,a:0},
  {t:'goal',x:900,y:100,band:RED,fixed:1}],
 sol:{2:[300,500,-45],3:[300,100,-45]}},
{name:'Split decision',hint:'A splitter sends half of the light each way.',

  {t:'emit',x:100,y:300,a:0,band:GRN,fixed:1},

  {t:'mirror',x:720,y:420,a:0},

  {t:'goal',x:800,y:500,band:GRN,fixed:1}],

{name:'Pick a color',hint:'Glass bends light toward the dashed normal. Each color bends differently.',

  {t:'emit',x:100,y:150,a:0,fixed:1},

{name:'Red filter',hint:'A filter lets one band of colors through.',

  {t:'wall',x:600,y:147,w:30,h:294,a:0,fixed:1},

// ---- Chapter 3: polarization
{name:'Crossed',hint:'Select the polarizer, then drag its amber knob to turn the axis.',pol:1,

  if(!done.includes(cur)){done.push(cur);saveDone()}
  const last=cur===LEVELS.length-1;
  card('<h2>Solved</h2><p>'+(last?'That was the last level. Replay any from the menu.':'Every target is lit.')+'</p><div class="row"><button id="wRe">Replay</button>'+(last?'<button id="wMenu" class="pri">Levels</button>':'<button id="wNext" class="pri">Next level</button>')+'</div>');
  $('wRe').onclick=()=>load(cur);
  if(last)$('wMenu').onclick=menu;else $('wNext').onclick=()=>load(cur+1);
}
function bandColor(b,a){
  if(b[0]<=400&&b[1]>=700)return 'rgba(255,255,255,'+a+')';
  const c=wlRGB((b[0]+b[1])/2);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function badge(x,y,deg,col,rad){
  rad=rad||11;const a=deg*D2R;
  ctx.fillStyle='#10141e';ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();ctx.stroke();
  ctx.lineWidth=2.2;ctx.lineCap='round';
  line(x-Math.cos(a)*(rad-4),y-Math.sin(a)*(rad-4),x+Math.cos(a)*(rad-4),y+Math.sin(a)*(rad-4));
}
function phaseBadge(x,y,deg,col){
  ctx.fillStyle='#10141e';ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.stroke();
  if(deg>0){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,8,-Math.PI/2,-Math.PI/2+deg*D2R);ctx.closePath();ctx.fill()}
}
function polyPath(sg){ctx.beginPath();ctx.moveTo(sg[0].x1,sg[0].y1);sg.forEach(s=>ctx.lineTo(s.x2,s.y2));ctx.closePath()}
function drawLens(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
  const h=p.len/2;ctx.beginPath();
  if(p.f>0){ctx.moveTo(-h,0);ctx.quadraticCurveTo(0,-17,h,0);ctx.quadraticCurveTo(0,17,-h,0)}
  else{ctx.moveTo(-h,-10);ctx.quadraticCurveTo(0,-2,h,-10);ctx.lineTo(h,10);ctx.quadraticCurveTo(0,2,-h,10);ctx.closePath()}
  ctx.fillStyle='rgba(150,200,255,0.2)';ctx.fill();
  ctx.strokeStyle='rgba(215,232,255,0.95)';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  ctx.restore();
}
function drawDisc(p){
  const col=p.t==='pol'?'#c9d4f0':p.t==='hwp'?'#ffd27a':'#c8a6ff';
  ctx.save();
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
  ctx.fillStyle='rgba(16,20,30,.82)';ctx.fill();
  ctx.clip();
  if(p.t==='phase'){
    ctx.fillStyle='rgba(200,166,255,.45)';ctx.beginPath();ctx.moveTo(p.x,p.y);
    ctx.arc(p.x,p.y,p.r,-Math.PI/2,-Math.PI/2+p.ax*D2R);ctx.closePath();ctx.fill();
  }else{
    const a=p.ax*D2R,c=Math.cos(a),s=Math.sin(a);
    ctx.strokeStyle=col;ctx.lineWidth=p.t==='hwp'?3:1.6;ctx.globalAlpha=.85;
    for(let o=-p.r;o<=p.r;o+=p.t==='hwp'?9:6){
      line(p.x-s*o-c*p.r*1.2,p.y+c*o-s*p.r*1.2,p.x-s*o+c*p.r*1.2,p.y+c*o+s*p.r*1.2);
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.strokeStyle=col;ctx.lineWidth=p.t==='hwp'?4:2.5;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
}
function bolt(x,y){
  ctx.fillStyle='#2a3144';ctx.strokeStyle='#9aa3ba';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();ctx.stroke();
  ctx.lineWidth=1.2;line(x-2.2,y-2.2,x+2.2,y+2.2);
}
function marks(p){
  if(p.t==='wall'||p.t==='emit'||p.t==='goal')return;
  if(p.fixed){
    if(p.t==='prism'){segsOf(p).forEach(s=>bolt(s.x1,s.y1))}
    else if(DISC[p.t]){for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;bolt(p.x+Math.cos(a)*p.r,p.y+Math.sin(a)*p.r)}}
    else if(p.len){const s=segsOf(p)[0];bolt(s.x1,s.y1);bolt(s.x2,s.y2)}
  }else{
    ctx.fillStyle='#10141e';ctx.strokeStyle='#7fd6ff';ctx.lineWidth=2.2;
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7fd6ff';ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill();
  }
}
function drawPiece(p){
  if(p.t==='prism'){
    polyPath(segsOf(p));ctx.strokeStyle='rgba(205,228,255,0.85)';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();return;
  }
  if(p.t==='lens'){drawLens(p);return}
  if(!p.len&&p.t!=='emit'&&!DISC[p.t])return;
  const s=p.len?segsOf(p)[0]:null;
  ctx.lineCap='round';
  if(p.t==='mirror'){
    ctx.strokeStyle='#59627f';ctx.lineWidth=9;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#eef3ff';ctx.lineWidth=4;line(s.x1,s.y1,s.x2,s.y2);
  }else if(p.t==='split'){
    ctx.strokeStyle='#3d6a8a';ctx.lineWidth=9;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#bfe6ff';ctx.lineWidth=4;ctx.setLineDash([7,7]);line(s.x1,s.y1,s.x2,s.y2);ctx.setLineDash([]);
  }else if(p.t==='filter'){
    ctx.lineCap='butt';ctx.strokeStyle=bandColor(p.band,0.9);ctx.lineWidth=8;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;line(s.x1,s.y1,s.x2,s.y2);
  }else if(p.t==='dichro'){
    ctx.strokeStyle='#59627f';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=5;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.2;line(s.x1,s.y1,s.x2,s.y2);
  }else if(DISC[p.t]){
    drawDisc(p);
  }else if(p.t==='pbs'){
    ctx.strokeStyle='#2f5a55';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#9fe3d0';ctx.lineWidth=4;ctx.setLineDash([9,5]);line(s.x1,s.y1,s.x2,s.y2);ctx.setLineDash([]);
    badge(p.x,p.y,p.ax,'#9fe3d0');
  }else if(p.t==='emit'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.fillStyle='#161b28';ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=3;
    ctx.beginPath();ctx.rect(-14,-12,26,24);ctx.fill();ctx.stroke();
    ctx.fillStyle=bandColor(p.band,1);ctx.beginPath();ctx.moveTo(12,-6);ctx.lineTo(20,0);ctx.lineTo(12,6);ctx.fill();
    ctx.restore();
    if(LEVELS[cur].pol)badge(p.x,p.y-26,p.pol,'#ffffff',9);
  }
}
function draw(time){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
  ctx.fillStyle='#0d1018';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1b2132';
  for(let x=50;x<W;x+=50)for(let y=50;y<H;y+=50)ctx.fillRect(x-1,y-1,2,2);
  ctx.strokeStyle='#262c3d';ctx.lineWidth=2;ctx.strokeRect(0,0,W,H);
  for(const p of pieces)if(p.rail!==undefined){
    const r=p.rail*D2R,c=Math.cos(r),s=Math.sin(r);
    ctx.strokeStyle='rgba(127,214,255,.28)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
    line(p.ox-c*p.range,p.oy-s*p.range,p.ox+c*p.range,p.oy+s*p.range);ctx.setLineDash([]);
  }
  for(const p of pieces)if(p.t==='wall'){
    polyPath(segsOf(p));ctx.fillStyle='#1a1f2e';ctx.fill();ctx.strokeStyle='#3a4360';ctx.lineWidth=2;ctx.stroke();
  }
  for(const p of pieces)if(p.t==='prism'){polyPath(segsOf(p));ctx.fillStyle='rgba(150,200,255,0.10)';ctx.fill()}
  if(lastTrace){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    const step=Math.max(6,(lastTrace.totalLen||0)/5000),coh=!!LEVELS[cur].coh;
    for(const pass of [0,1]){
      for(const r of lastTrace.rays){
        const c=RGB[r.i],a=Math.min(1,r.I*r.K);
        ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(pass?0.5*a:0.07*a)+')';
        ctx.lineWidth=pass?2.2:8;
        const dx=r.x2-r.x1,dy=r.y2-r.y1,L=Math.hypot(dx,dy);
        if(pass===1&&wavy&&L>12){
          const ux=dx/L,uy=dy/L,k=2*Math.PI/(WL[r.i]/LG),A=(coh?7:3)*Math.sqrt(a);
          const n=Math.max(2,Math.ceil(L/step));
          ctx.beginPath();
          for(let j=0;j<=n;j++){
            const sd=L*j/n,tp=Math.min(1,sd/8,(L-sd)/8);
            const o=A*tp*Math.sin((coh?r.ph0:r.vp0)+k*r.n*sd-k*WSPEED*time);
            const X=r.x1+ux*sd-uy*o,Y=r.y1+uy*sd+ux*o;
            if(j)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);
          }
          ctx.stroke();
        }else line(r.x1,r.y1,r.x2,r.y2);
      }
    }
    ctx.globalCompositeOperation='source-over';
  }
  for(const p of pieces){
    drawPiece(p);marks(p);
    if(p===sel){
      ctx.strokeStyle='rgba(127,214,255,.9)';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.arc(p.x,p.y,radius(p)+10,0,7);ctx.stroke();ctx.setLineDash([]);
      if(DIALS[p.t]){
        const D=DIALS[p.t],k=dialPos(p);
        ctx.strokeStyle='rgba(255,210,122,.55)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.arc(p.x,p.y,dialR(p),0,7);ctx.stroke();ctx.setLineDash([]);
        if(p.t!=='phase'){ctx.strokeStyle='rgba(255,210,122,.8)';ctx.lineWidth=2;line(2*p.x-k.x,2*p.y-k.y,k.x,k.y)}
        ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(k.x,k.y,9,0,7);ctx.fill();
        ctx.fillStyle='#ffd27a';ctx.font='600 13px system-ui,sans-serif';ctx.textAlign='center';
        ctx.fillText(dialLabel(p),p.x,p.y+radius(p)+26);
      }
      if(!p.norot){
        const h=handlePos(p);
        ctx.strokeStyle='rgba(127,214,255,.5)';line(p.x,p.y,h.x,h.y);
        ctx.fillStyle='#7fd6ff';ctx.beginPath();ctx.arc(h.x,h.y,9,0,7);ctx.fill();
      }
    }
  }
  if(guides)drawGuides();
  drawHints();
  if(lastTrace&&LEVELS[cur].pol){
    for(const r of lastTrace.rays){
      if(r.i!==lastTrace.minI||r.I<0.04)continue;
      const L=Math.hypot(r.x2-r.x1,r.y2-r.y1);
      if(L<130)continue;
      ctx.globalAlpha=Math.min(1,0.35+r.I);
      badge((r.x1+r.x2)/2,(r.y1+r.y2)/2,r.pol/D2R,'rgba(255,255,255,.85)',8);
      ctx.globalAlpha=1;
    }
  }
  let gi=0;
  for(const p of pieces)if(p.t==='goal'){
    const rs=lastTrace?lastTrace.res[gi]:{prog:0,pct:0,lit:false,bad:false};gi++;
    if(rs.lit){
      ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      g.addColorStop(0,bandColor(p.band||p.bands[0],0.8));g.addColorStop(1,bandColor(p.band||p.bands[0],0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
    const gb=p.band||(p.bands?[400,700]:[400,700]);
    const gcol=p.bands?'rgba(255,255,255,1)':bandColor(gb,1);
    ctx.fillStyle=rs.lit?(p.bands?'rgba(255,255,255,.95)':bandColor(gb,0.95)):'#0d1018';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    ctx.strokeStyle=rs.bad?'#ff6b6b':gcol;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
    const fill=p.show&&!p.dark?Math.min(1,rs.pct/(p.need||0.2)):rs.prog;
    if(!rs.lit&&fill>0&&!p.dark){
      ctx.strokeStyle=gcol;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+7,-Math.PI/2,-Math.PI/2+fill*Math.PI*2);ctx.stroke();
    }
    if(p.ex||p.dark){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,7);ctx.stroke()}
    if(p.show){
      let txt;
      if(p.dark)txt=rs.lit?'100%':(rs.bad?'too bright':'no light');
      else txt=Math.round((rs.lit?1:Math.min(0.99,rs.pct/(p.need||0.2)))*100)+'%';
      const below=p.y+p.r+24<=H;
      const y1=below?p.y+p.r+20:p.y-p.r-10;
      ctx.textAlign='center';ctx.font='600 14px system-ui,sans-serif';
      ctx.fillStyle=rs.lit?'#6fe3a0':(rs.bad?'#ff8a8a':'#aab3c8');
      ctx.fillText(txt,p.x,y1);
    }
  }
  ctx.restore();
}
function frame(t){
  const redraw=dirty;
  if(dirty){
    lastTrace=trace(pieces);dirty=false;
    let tl=0;for(const r of lastTrace.rays)tl+=Math.hypot(r.x2-r.x1,r.y2-r.y1);
    lastTrace.totalLen=tl;
    const all=lastTrace.res.length>0&&lastTrace.res.every(r=>r.lit);
    if(all){if(!litSince)litSince=t}else litSince=0;
  }
  if(redraw||wavy)draw(t/1000);
  if(!solved&&litSince&&t-litSince>500)win();
  requestAnimationFrame(frame);
}
resize();
let start=0;
if(done.length){start=Math.min(LEVELS.length-1,Math.max(...done)+1)}
load(start);
requestAnimationFrame(frame);
})();
</script>
</body></html>
