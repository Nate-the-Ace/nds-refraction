<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Refract</title>
<style>
:root{--bg:#0a0c12;--panel:#12151f;--line:#262c3d;--ink:#e8ecf6;--dim:#8d96ad;--acc:#7fd6ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#side{display:contents}
#zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoom button{width:44px;min-height:44px;padding:0;font-size:20px;line-height:1;background:rgba(18,21,31,.88)}
#zoom #zFit{font-size:12px}
#tip{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:calc(100% - 140px);background:rgba(18,21,31,.94);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--dim);text-align:center;z-index:4;display:none}
#tip.on{display:block}
header,footer{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
header{justify-content:space-between}
h1{font-size:16px;font-weight:600;margin:0;text-align:center;flex:1;letter-spacing:.01em;min-width:0}
h1 small{display:block;font-weight:400;color:var(--dim);font-size:12px;line-height:1.3}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#stage{flex:1;min-height:0;min-width:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
footer{justify-content:center;min-height:58px;flex-wrap:wrap}
.grp{display:none;gap:8px;align-items:center}
.grp.on{display:flex}
#shelf{display:none;flex:none;flex-direction:column;background:#0f121b;border-top:1px solid var(--line)}
#shelf.on{display:flex}
#drawer{display:none;align-items:flex-start;gap:8px;padding:8px 12px;overflow-x:auto;background:#161a26;border-bottom:1px solid var(--line);box-shadow:inset 0 6px 10px -8px #000}
#drawer.open{display:flex}
#tabs{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;justify-content:center;flex-wrap:wrap}
#tabs .tab{position:relative;padding:6px 12px 10px;font-size:13px;min-height:34px;border-radius:8px 8px 4px 4px;white-space:nowrap}
#tabs .tab::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--line)}
#tabs .tab.on{border-color:var(--acc);background:#1b2233}
#tabs .tab.on::after{background:var(--acc)}
#tabs .tab i{font-style:normal;font-size:11px;color:var(--dim);margin-left:6px}
.item{position:relative;flex:none;display:block;text-align:center;padding:6px 8px;min-height:0;height:auto;min-width:84px;touch-action:none}
.item canvas,#ghost canvas{position:static;inset:auto;display:block;margin:0 auto 2px;width:72px;height:44px;pointer-events:none}
.item span{display:block;font-size:11px;color:var(--dim);white-space:nowrap;pointer-events:none}
.item i{position:absolute;top:3px;right:5px;font-style:normal;font-size:11px;color:var(--acc);pointer-events:none}
.item.out{opacity:.35;cursor:default}
#ghost{position:fixed;z-index:20;pointer-events:none;opacity:.85;display:none}
#selbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none;z-index:4}
#selbar .grp{pointer-events:auto;background:rgba(18,21,31,.94);border:1px solid var(--line);border-radius:12px;padding:4px 6px;flex-wrap:wrap;justify-content:center}
#selact button{padding:7px 11px;font-size:13px;min-height:36px}
#selact .del{border-color:#7a3d3d}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,12,.74);z-index:5;padding:12px}
#over.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:min(94vw,540px);width:100%;max-height:92%;overflow:auto;text-align:center}
.card h2{margin:0 0 6px;font-size:22px;font-weight:600}
.card h3{margin:14px 0 8px;font-size:14px;font-weight:600;text-align:left;color:var(--acc)}
.card p{color:var(--dim);margin:0 0 16px;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{display:flex;flex-direction:column;gap:2px;padding:8px 2px;min-width:0}
.grid b{font-size:17px;font-weight:600}
.grid span{font-size:10px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.grid .done{border-color:#3d7a57}
.grid .done b::after{content:" \2713";color:#6fe3a0;font-size:13px}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pri{background:var(--acc);color:#05202e;border-color:var(--acc);font-weight:600}
@media (pointer:coarse){button{min-height:44px}#selact button{min-height:44px}.grid button{min-height:48px}}
@media (max-width:400px){header{padding:6px 8px}button{padding:8px 11px}footer{gap:6px;padding:6px 8px}.grid{gap:4px}.card{padding:16px}}
/* phone held sideways, or forced sideways on a portrait phone: the shelf and buttons move to a rail so the board keeps the height */
  html.rail header{padding:4px 8px;gap:6px}
  html.rail h1{font-size:14px;cursor:pointer}
  html.rail h1 small{display:none}
  html.rail header button{min-height:36px;padding:5px 12px}
  html.rail #main{flex-direction:row}
  html.rail #side{display:flex;flex-direction:column;flex:none;width:128px;background:#0f121b;border-left:1px solid var(--line);overflow-y:auto;padding-right:env(safe-area-inset-right,0px)}
  html.rail body{padding-right:0}
  html.rail footer{flex-direction:column;align-items:stretch;gap:5px;padding:6px;min-height:0;flex-wrap:nowrap;margin-top:auto}
  html.rail footer button{min-height:36px;padding:4px 6px;font-size:13px}
  html.rail #shelf{border-top:0}
  html.rail #tabs{flex-direction:column;flex-wrap:nowrap;overflow:visible;padding:6px;gap:5px;justify-content:flex-start}
  html.rail #tabs .tab{min-height:36px;padding:5px 8px 10px}
  html.rail body.dragging #drawer{visibility:hidden}
  html.rail #drawer{position:absolute;right:128px;top:0;bottom:0;width:204px;flex-wrap:wrap;align-content:flex-start;overflow-y:auto;border-bottom:0;border-right:1px solid var(--line);z-index:6;box-shadow:-6px 0 14px -8px #000}
  html.rail .item{min-width:84px}
  html.rail #zoom{flex-direction:row}
  html.rail #zoom button{width:40px;min-height:40px}
  html.rail #tip{max-width:calc(100% - 200px)}
  html.rail .card{padding:14px;max-height:96%}
  html.rail .card h2{font-size:18px}
  html.rail .card p{margin-bottom:10px}
/* a portrait phone turns the whole interface a quarter turn, so the board always gets the long side */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
html.rot{padding:0}
html.rot body{padding:0;overflow:hidden}
html.rot #app{position:fixed;top:0;left:0;width:var(--vh);height:var(--vw);transform-origin:0 0;transform:translateX(var(--vw)) rotate(90deg);padding-left:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-bottom,0px)}
</style></head>
<body>
<div id="app">
<header>
  <button id="bMenu" aria-label="Levels">Levels</button>
  <h1 id="title"></h1>
  <button id="bReset" aria-label="Reset level">Reset</button>
</header>
<div id="main"><div id="stage"><canvas id="cv"></canvas>
  <div id="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">&minus;</button><button id="zFit" aria-label="Fit the whole board">Fit</button></div>
  <div id="tip" role="status"></div>
  <div id="selbar"><div id="selact" class="grp"></div><div id="rot" class="grp"><button id="rL" aria-label="Turn left">Turn left</button><button id="rR" aria-label="Turn right">Turn right</button></div></div>
  <div id="over"><div class="card" id="card"></div></div>
</div>
<div id="side"><div id="shelf"></div>
<footer>
  <button id="bHint" aria-label="Show a hint">Hint</button>
  <button id="bWave" aria-label="Toggle wave animation">Waves: on</button>
  <button id="bGuide" aria-label="Toggle guides">Guides: on</button>
  </footer></div></div>
</div>
<div id="ghost"></div>
<script>
const W=1000,H=600,NW=40,LG=6;
const WL=[];for(let i=0;i<NW;i++)WL.push(400+300*i/(NW-1));
const ior=wl=>1.35+3e4/(wl*wl);
const D2R=Math.PI/180;
function wlRGB(wl){
  let r=0,g=0,b=0;
  if(wl<440){r=(440-wl)/60;b=1}else if(wl<490){g=(wl-440)/50;b=1}else if(wl<510){g=1;b=(510-wl)/20}
  else if(wl<580){r=(wl-510)/70;g=1}else if(wl<645){r=1;g=(645-wl)/65}else{r=1}
  const f=wl<420?0.3+0.7*(wl-380)/40:1;
  const c=v=>Math.round(255*Math.pow(Math.max(0,v*f),0.8));
  return [c(r),c(g),c(b)];
}
const DISC={pol:1,hwp:1,phase:1};
const ZF=[-60,-80,-100,-130,-170,-230,-340,-600,600,340,230,170,130,100,80,60];
const zf=p=>ZF[(Math.round(p.ax/22.5)%16+16)%16];
const DIALS={zlens:{step:22.5,mod:360,name:'Focal'},pol:{step:22.5,mod:180,name:'Axis'},hwp:{step:22.5,mod:180,name:'Axis'},pbs:{step:22.5,mod:180,name:'Axis'},phase:{step:45,mod:360,name:'Phase'}};
function normalize(p){
  p.a=(p.a||0)*D2R;
  const L={mirror:100,split:100,filter:80,lens:110,zlens:110,pbs:90,dichro:100};
  if(L[p.t])p.len=p.len||L[p.t];
  if(p.t==='prism')p.r=p.r||60;
  if(p.t==='orb'){p.r=p.r||50;p.norot=1}
  if(p.t==='bh'){p.r=p.r||16;p.norot=1}
  if(DISC[p.t]){p.r=p.r||30;p.norot=1}
  if(p.t==='goal')p.r=p.r||15;
  if(p.t==='lens'&&p.f===undefined)p.f=160;
  if(p.t==='zlens'&&p.ax===undefined)p.ax=247.5;
  if(DIALS[p.t]&&p.ax===undefined)p.ax=0;
  if(p.t==='emit'||p.t==='filter'||p.t==='goal'||p.t==='dichro')p.band=p.band||[400,700];
  if(p.t==='emit'){p.pol=(p.pol||0);p.nb=p.w?(p.nb||9):1;p.w=p.w||0}
  p.ox=p.x;p.oy=p.y;
  if(p.rail!==undefined&&p.range===undefined)p.range=150;
  return p;
}
function segsOf(p){
  const c=Math.cos(p.a),s=Math.sin(p.a);
  if(p.len&&p.t!=='prism'&&p.t!=='wall'){
    const h=p.len/2;return [{x1:p.x-c*h,y1:p.y-s*h,x2:p.x+c*h,y2:p.y+s*h,k:p.t,p}];
  }
  if(p.t==='prism'){
    const v=[0,1,2].map(k=>{const q=p.a+k*2*Math.PI/3;return [p.x+Math.cos(q)*p.r,p.y+Math.sin(q)*p.r]});
    return [0,1,2].map(k=>({x1:v[k][0],y1:v[k][1],x2:v[(k+1)%3][0],y2:v[(k+1)%3][1],k:'glass',p}));
  }
  if(p.t==='orb'){
    const n=36,v=[];for(let k=0;k<n;k++){const q=k*2*Math.PI/n;v.push([p.x+Math.cos(q)*p.r,p.y+Math.sin(q)*p.r])}
    return v.map((a,k)=>({x1:a[0],y1:a[1],x2:v[(k+1)%n][0],y2:v[(k+1)%n][1],k:'glass',p}));
  }
  if(p.t==='wall'){
    const hw=p.w/2,hh=p.h/2;
    const v=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([u,w])=>[p.x+u*c-w*s,p.y+u*s+w*c]);
    return [0,1,2,3].map(k=>({x1:v[k][0],y1:v[k][1],x2:v[(k+1)%4][0],y2:v[(k+1)%4][1],k:'wall',p}));
  }
  return [];
}
const BOX=[[0,0,W,0],[W,0,W,H],[W,H,0,H],[0,H,0,0]].map(([a,b,c,d])=>({x1:a,y1:b,x2:c,y2:d,k:'wall',p:null}));
// Black holes: light follows Schwarzschild null geodesics. In the plane, with u=1/r and
// the angle phi around the hole, u'' = -u + 1.5*rs*u^2 (rs = horizon radius). Rays are
// advanced in short chords by integrating that equation; inside rs they are swallowed.
// Game rule: the pull depends on wavelength, so shorter wavelengths bend more and white light
// fans out like it does in glass. GS scales the effective horizon radius (0.7 at 700 nm, 1.3 at 400 nm).
const GS=wl=>1+0.3*(550-wl)/150;
const wlOf=r=>r.wl!==undefined?r.wl:WL[r.i];
const SUB=4;
// One hole's exact geodesic step of length L from ray r. Returns the end point and direction.
function bhStep(r,b,L,gs){
  const rs=b.r*gs,dx=r.x-b.x,dy=r.y-b.y,nd=Math.hypot(dx,dy);
  const cp=(dx*r.dx+dy*r.dy)/nd,sn=(dx*r.dy-dy*r.dx)/nd,as=Math.abs(sn);
  let x2,y2,dx2,dy2,cap=0;
  if(as<0.03){x2=r.x+r.dx*L;y2=r.y+r.dy*L;dx2=r.dx;dy2=r.dy;if(Math.hypot(x2-b.x,y2-b.y)<=rs)cap=1}
  else{
    const sg=sn>0?1:-1,u0=1/nd,k=1.5*rs;
    let u=u0,w=-u0*cp/as;
    const dphi=L*as/nd,n=Math.max(1,Math.ceil(dphi/0.08)),h=dphi/n;
    for(let i=0;i<n&&!cap;i++){
      const a1=-u+k*u*u,u2=u+h/2*w,w2=w+h/2*a1,a2=-u2+k*u2*u2,u3=u+h/2*w2,w3=w+h/2*a2,a3=-u3+k*u3*u3,u4=u+h*w3,w4=w+h*a3,a4=-u4+k*u4*u4;
      u+=h/6*(w+2*w2+2*w3+w4);w+=h/6*(a1+2*a2+2*a3+a4);
      if(u>=1/rs)cap=1;
    }
    if(u<=1e-7)u=1e-7;
    const phi=Math.atan2(dy,dx)+sg*dphi,rr=1/u;
    x2=b.x+rr*Math.cos(phi);y2=b.y+rr*Math.sin(phi);
    const q=w/u,vp=1/Math.sqrt(1+q*q),vr=-q*vp;
    dx2=vr*Math.cos(phi)-sg*vp*Math.sin(phi);dy2=vr*Math.sin(phi)+sg*vp*Math.cos(phi);
  }
  return {x2,y2,dx2,dy2,cap};
}
// With several holes each one's exact step is computed on its own and the bends are added,
// so a hole dominates where it is close and the pulls combine where they are comparable.
function bhChord(r,bhs){
  const gs=GS(wlOf(r));
  let L=40;
  for(const b of bhs){
    const dx=r.x-b.x,dy=r.y-b.y,d=Math.hypot(dx,dy),rs=b.r*gs;
    if(d<=rs)return {cap:1,len:0};
    L=Math.min(L,Math.max(5,d*0.18));
    if(dx*r.dx+dy*r.dy<0)L=Math.min(L,Math.max(d-rs+1,2));
  }
  const sx=r.x+r.dx*L,sy=r.y+r.dy*L;
  let ax=0,ay=0,adx=0,ady=0,cap=0;
  for(const b of bhs){
    const o=bhStep(r,b,L,gs);
    if(o.cap)cap=1;
    ax+=o.x2-sx;ay+=o.y2-sy;adx+=o.dx2-r.dx;ady+=o.dy2-r.dy;
  }
  const x2=sx+ax,y2=sy+ay;
  let dx2=r.dx+adx,dy2=r.dy+ady;const hl=Math.hypot(dx2,dy2);dx2/=hl;dy2/=hl;
  const cx=x2-r.x,cy=y2-r.y,len=Math.hypot(cx,cy);
  if(len<1e-9)return {cap:1,len:0};
  return {cap,len,cx:cx/len,cy:cy/len,x2,y2,dx2,dy2};
}
function trace(pieces){
  const segs=[],goals=[],emit=[],discs=[],bhs=[];
  for(const p of pieces){
    if(p.t==='bh'){bhs.push(p);continue}
    if(p.t==='goal')goals.push(p);else if(p.t==='emit')emit.push(p);else if(DISC[p.t])discs.push(p);else segs.push(...segsOf(p));
  }
  segs.push(...BOX);
  const st=goals.map(()=>({inc:new Float32Array(NW),re:new Float32Array(NW),im:new Float32Array(NW)}));
  const out=[],stack=[],ev=[];
  let minI=NW;const emitted=[];
  for(const e of emit){
    const dx=Math.cos(e.a),dy=Math.sin(e.a),px=-dy,py=dx;
    for(let i=0;i<NW;i++)if(WL[i]>=e.band[0]&&WL[i]<=e.band[1]){
      minI=Math.min(minI,i);emitted.push(i);
      // Gravity spreads the beam and the spectrum, so with a black hole in play the
      // emitter fires extra rays: sub-wavelengths for a thin beam, a denser beam for a wide one.
      const sub=bhs.length&&e.nb===1?SUB:1,nbe=bhs.length&&e.nb>1?e.nb*3-2:e.nb,step=300/(NW-1);
      for(let k=0;k<nbe;k++){
        const off=nbe>1?(k/(nbe-1)-0.5)*e.w:0;
        for(let q=0;q<sub;q++){
          const o={x:e.x+dx*16+px*off,y:e.y+dy*16+py*off,dx,dy,i,I:1/(nbe*sub),K:nbe*sub,ins:null,d:0,pol:e.pol*D2R,ph:0,vp:0};
          if(sub>1)o.wl=WL[i]+(q-(sub-1)/2)*step/sub;
          stack.push(o);
        }
      }
    }
  }
  const mk=(r,o)=>Object.assign({wl:r.wl,x:r.x,y:r.y,dx:r.dx,dy:r.dy,i:r.i,I:r.I,K:r.K,ins:r.ins,d:r.d+1,pol:r.pol,ph:r.ph,vp:r.vp},o);
  let guard=0;
  while(stack.length&&guard++<400000){
    let r=stack.pop();
    if(r.d>30||r.I<0.01)continue;
    let ch=null;
    if(bhs.length){ch=bhChord(r,bhs);if(ch.len<=0)continue;r=Object.assign({},r,{dx:ch.cx,dy:ch.cy})}
    let bt=ch?ch.len:1e9,bs=null,bg=-1,bd=null;
    for(const s of segs){
      const ex=s.x2-s.x1,ey=s.y2-s.y1,den=r.dx*ey-r.dy*ex;
      if(Math.abs(den)<1e-9)continue;
      const qx=s.x1-r.x,qy=s.y1-r.y;
      const t=(qx*ey-qy*ex)/den,u=(qx*r.dy-qy*r.dx)/den;
      if(t>1e-4&&u>=0&&u<=1&&t<bt){bt=t;bs=s;bg=-1;bd=null}
    }
    for(const d of discs){
      const fx=d.x-r.x,fy=d.y-r.y,t=fx*r.dx+fy*r.dy;
      if(t>1e-4&&Math.abs(fx*r.dy-fy*r.dx)<=d.r&&t<bt){bt=t;bd=d;bs=null;bg=-1}
    }
    for(let gi=0;gi<goals.length;gi++){
      const g=goals[gi],fx=r.x-g.x,fy=r.y-g.y;
      const b=fx*r.dx+fy*r.dy,cc=fx*fx+fy*fy-g.r*g.r,disc=b*b-cc;
      if(disc>0){const t=-b-Math.sqrt(disc);if(t>1e-4&&t<bt){bt=t;bs=null;bg=gi;bd=null}}
    }
    const hx=r.x+r.dx*bt,hy=r.y+r.dy*bt;
    const lamg=wlOf(r)/LG;
    const nn=r.ins?ior(wlOf(r)):1,dph=2*Math.PI*bt*nn/lamg;
    const ph=r.ph+dph,vp=r.vp+dph;
    out.push({x1:r.x,y1:r.y,x2:hx,y2:hy,i:r.i,ci:r.wl!==undefined?Math.round((r.wl-400)*SUB*(NW-1)/300):r.i*SUB,I:r.I,K:r.K,pol:r.pol,vp0:r.vp,ph0:r.ph,n:nn});
    if(ch&&!bs&&!bd&&bg<0){if(!ch.cap)stack.push(Object.assign({},r,{x:hx,y:hy,dx:ch.dx2,dy:ch.dy2,ph,vp}));continue}
    if(bg>=0){const s=st[bg],a=Math.sqrt(r.I);s.inc[r.i]+=r.I;s.re[r.i]+=a*Math.cos(ph);s.im[r.i]+=a*Math.sin(ph);continue}
    if(bd){
      const b2=Object.assign({},r,{x:hx,y:hy,ph,vp}),p=bd;
      if(p.t==='phase')stack.push(mk(b2,{ph:ph+p.ax*D2R}));

function evalGoal(g,s){
  const bands=g.bands||[g.band],need=g.need||0.2;
  let inN=0,hit=0,outside=0,sum=0,incSum=0;
  for(let i=0;i<NW;i++){
    const w=WL[i];let inb=false;
    for(const b of bands)if(w>=b[0]&&w<=b[1]){inb=true;break}
    const en=g.coh?s.re[i]*s.re[i]+s.im[i]*s.im[i]:s.inc[i];
    if(inb){inN++;sum+=en;incSum+=s.inc[i];if(en>=need)hit++}else outside+=s.inc[i];
  }
  const pct=inN?sum/inN:0;
  if(g.dark){

    return {prog:inc>=0.3?1:0,pct,lit:inc>=0.3&&pct<=0.05,bad:inc>=0.3&&pct>0.05};
  }
  const prog=inN?hit/inN:0;
  return {prog,pct,lit:prog>=0.7&&(!g.ex||outside<=2),bad:!!g.ex&&outside>2};
}

const inB=(x,y,m)=>x>=m&&x<=W-m&&y>=m&&y<=H-m;
function nodeSeg(n,len){
  const a=(n.k==='branch'?turnMirror(n.din,n.dside):turnMirror(n.din,n.dout))*R,h=(len||100)/2;
  return [n.x-Math.cos(a)*h,n.y-Math.sin(a)*h,n.x+Math.cos(a)*h,n.y+Math.sin(a)*h];

// ---------- tree of beam paths
// node kinds: turn (mirror), branch (splitter-like, a = straight child, b = side child), goal (leaf)
function growTree(rnd,o){
  const margin=o.margin||55,gap=o.legGap||45;
  for(let att=0;att<(o.tries||600);att++){
    const nodes=[],legs=[];let fail=false;
    const d0=o.d0!==undefined?o.d0:10*ri(rnd,0,35);
    const sx=o.sx||rr(rnd,70,930),sy=o.sy||rr(rnd,70,530);
    const ext=(x,y,d,s,m,par,first)=>{
      if(fail)return null;
      const L=first&&o.firstL?o.firstL:rr(rnd,o.minL||120,o.maxL||300);
      const nx=x+Math.cos(d*R)*L,ny=y+Math.sin(d*R)*L;
      if(!inB(nx,ny,margin)){fail=true;return null}
      const node={x:nx,y:ny,din:d,par,k:'goal'};
      legs.push({x1:x,y1:y,x2:nx,y2:ny,d,len:L,to:node,from:par});
      nodes.push(node);
      if(s>0&&(m===0||rnd()<0.5)){
        node.k='branch';node.dside=n360(d+pick(rnd,TURNS));
        const sa=ri(rnd,0,s-1),sb=s-1-sa,ma=ri(rnd,0,m),mb=m-ma;
        node.a=ext(nx,ny,d,sa,ma,node);node.b=ext(nx,ny,node.dside,sb,mb,node);
      }else if(m>0){
        node.k='turn';node.dout=n360(d+pick(rnd,TURNS));
        node.next=ext(nx,ny,node.dout,s,m-1,node);
      }
      return node;
    };
    const first=ext(sx,sy,d0,o.splits||0,o.turns||0,null,true);
    if(fail)continue;
    if(layoutOk(sx,sy,nodes,legs,gap,o.nodeGap))return {sx,sy,d0,first,nodes,legs};
  }
  return null;
}
function layoutOk(sx,sy,nodes,legs,gap,nodeGap){
  const ng=nodeGap||115;
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    if(Math.hypot(a.x-sx,a.y-sy)<110)return false;
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      if(Math.hypot(a.x-b.x,a.y-b.y)<(a.k==='goal'||b.k==='goal'?85:ng))return false;
    }
  }
  const share=(p,q)=>p.to===q.to||p.to===q.from||q.to===p.from||(p.from===q.from&&p.from);
  for(let i=0;i<legs.length;i++)for(let j=i+1;j<legs.length;j++){
    const p=legs[i],q=legs[j];if(share(p,q))continue;
    if(segDist(p.x1,p.y1,p.x2,p.y2,q.x1,q.y1,q.x2,q.y2)<gap)return false;
  }
  for(const n of nodes){
    if(n.k==='goal')continue;
    const s=nodeSeg(n);
    for(const l of legs){
      if(l.to===n||l.from===n)continue;
      if(segDist(s[0],s[1],s[2],s[3],l.x1,l.y1,l.x2,l.y2)<24)return false;
    }
    // own legs must not graze the node's other half
    for(const l of legs){
      if(l.to!==n&&l.from!==n)continue;
      const d1=pSeg(l.x1,l.y1,s[0],s[1],s[2],s[3]),d2=pSeg(l.x2,l.y2,s[0],s[1],s[2],s[3]);
      if(Math.min(d1,d2)>1&&false)return false;
    }
  }
  return true;
}

// ---------- walls
function toLocal(w,x,y){const a=-w.a*R,dx=x-w.x,dy=y-w.y;return [dx*Math.cos(a)-dy*Math.sin(a),dx*Math.sin(a)+dy*Math.cos(a)]}
function wallPtDist(w,x,y){
  const [u,v]=toLocal(w,x,y),du=Math.max(Math.abs(u)-w.w/2,0),dvv=Math.max(Math.abs(v)-w.h/2,0);
  return Math.hypot(du,dvv);
}
function wallHitsSeg(w,x1,y1,x2,y2,m){
  const [u1,v1]=toLocal(w,x1,y1),[u2,v2]=toLocal(w,x2,y2),hu=w.w/2+m,hv=w.h/2+m;
  let t0=0,t1=1;const du=u2-u1,dvv=v2-v1;
  for(const [p,d,h] of [[u1,du,hu],[v1,dvv,hv]]){
    if(Math.abs(d)<1e-9){if(Math.abs(p)>h)return false}
    else{let a=(-h-p)/d,b=(h-p)/d;if(a>b)[a,b]=[b,a];t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)return false}
  }
  return true;
}
function wallInBoard(w){
  const c=Math.cos(w.a*R),s=Math.sin(w.a*R);
  for(const [u,v] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
    const x=w.x+u*w.w/2*c-v*w.h/2*s,y=w.y+u*w.w/2*s+v*w.h/2*c;
    if(x<8||x>W-8||y<8||y>H-8)return false;
  }
  return true;
}
// keep: {legs:[{x1..y2}], pts:[[x,y,r]], walls:[...]}
function wallClear(w,keep,beamHalf){
  if(!wallInBoard(w))return false;
  for(const l of keep.legs)if(wallHitsSeg(w,l.x1,l.y1,l.x2,l.y2,28+(beamHalf||0)))return false;
  for(const [x,y,r] of keep.pts)if(wallPtDist(w,x,y)<r)return false;
  for(const o of keep.walls)if(Math.hypot(o.x-w.x,o.y-w.y)<(o.h+w.h)/2*0.6+30)return false;
  return true;
}
function addWalls(rnd,sp,keep,count,chord,beamHalf){
  const walls=[];keep.walls=walls;
  if(chord){
    for(let t=0;t<30&&!walls.length;t++){
      const f=rr(rnd,0.3,0.7),cx=chord[0]+(chord[2]-chord[0])*f,cy=chord[1]+(chord[3]-chord[1])*f;
      const ang=Math.atan2(chord[3]-chord[1],chord[2]-chord[0])/R;
      const w={t:'wall',x:Math.round(cx),y:Math.round(cy),w:30,h:5*ri(rnd,40,70),a:Math.round(ang/5)*5,fixed:1};
      if(wallClear(w,keep,beamHalf))walls.push(w);
    }
  }
  for(let t=0;t<200&&walls.length<count;t++){
    const w={t:'wall',x:5*ri(rnd,14,186),y:5*ri(rnd,10,110),w:30,h:5*ri(rnd,20,50),a:15*ri(rnd,0,11),fixed:1};
    if(wallClear(w,keep,beamHalf))walls.push(w);
  }
  for(const w of walls)sp.fix.push(w);
}

// ---------- spec helpers
function newSpec(){return {emit:[],fix:[],mov:[],decoys:[],goals:[],legs:[],pts:[],meta:{},allowFail:0,wall:0}}
function mirrorPiece(n){return {t:'mirror',x:n.x,y:n.y,a:turnMirror(n.din,n.dout)}}
function legList(tree){return tree.legs.map(l=>({x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2}))}
function nodePts(tree,r){return tree.nodes.map(n=>[n.x,n.y,r||80]).concat([[tree.sx,tree.sy,70]])}
// pick spots on legs: returns [{x,y,d,leg}]
function spots(rnd,tree,count,edge,apart,fromLegs){
  const out=[];
  const legs=(fromLegs||tree.legs).filter(l=>l.len>=2*edge+10);
  if(!legs.length)return null;
  for(let tries=0;tries<200&&out.length<count;tries++){
    const l=pick(rnd,legs),u=rr(rnd,edge,l.len-edge),d=dv(l.d);
    const x=l.x1+d[0]*u,y=l.y1+d[1]*u;
    if(out.some(o=>Math.hypot(o.x-x,o.y-y)<apart))continue;
    if(tree.nodes.some(n=>Math.hypot(n.x-x,n.y-y)<edge))continue;
    out.push({x,y,d:l.d,leg:l});
  }
  return out.length===count?out:null;
}
function emitterAt(tree,band,extra){return Object.assign({t:'emit',x:tree.sx,y:tree.sy,a:tree.d0,band,fixed:1},extra||{})}
function goalPiece(n,band,extra){return Object.assign({t:'goal',x:n.x,y:n.y,band,r:15,fixed:1},extra||{})}
function addMov(sp,p,extra){sp.mov.push(Object.assign({p},extra||{}))}
function makeGoal(sp,p,rl,extra){sp.goals.push(Object.assign({p,rl:rl||[13,16,20,25]},extra||{}))}
function addTreePieces(sp,tree,opt){
  // standard realisation: turn->mirror, branch->kind per opt.branch, goals via opt.goal(node)
  for(const n of tree.nodes){
    if(n.k==='turn')addMov(sp,mirrorPiece(n));
    else if(n.k==='branch'){
      const a=turnMirror(n.din,n.dside);
      opt.branch(n,a);
    }else opt.goal(n);
  }
}

// ---------- assemble / evaluate
function assemble(sp,st){
  const arr=[];
  for(const p of sp.emit)arr.push(clone(p));
  for(const p of sp.fix)arr.push(clone(p));
  sp.mov.forEach((m,i)=>{
    const p=clone(m.p),s=st&&st[i];
    if(s){p.x=s.x;p.y=s.y;if(s.a!==undefined)p.a=s.a;if(s.ax!==undefined)p.ax=s.ax}
    arr.push(p);
  });
  for(const p of sp.decoys)arr.push(clone(p));
  for(const g of sp.goals)arr.push(clone(g.p));
  return arr;
}
function evalRaw(raw){return trace(raw.map(normalize))}
function allLit(res){return res.length>0&&res.every(r=>r.lit)}
const solved=(sp,st)=>allLit(evalRaw(assemble(sp,st)).res);

function snapMov(sp){
  for(const m of sp.mov){
    const p=m.p;
    if(p.rail===undefined){p.x=r5(p.x);p.y=r5(p.y)}
    if(!DISCT[p.t]&&p.t!=='prism'&&!p.norot)p.a=r5(p.a);
    if(DISCT[p.t])p.a=0;
  }
}
function neighbours(sp){
  const out=[];
  sp.mov.forEach((m,i)=>{
    const p=m.p,ds=p.rail!==undefined?(()=>{const c=Math.cos(p.rail*R),s=Math.sin(p.rail*R);return [[5*c,5*s],[-5*c,-5*s]]})():[[5,0],[-5,0],[0,5],[0,-5]];
    for(const [dx,dy] of ds){
      const st=sp.mov.map(mm=>({x:mm.p.x,y:mm.p.y}));
      st[i]={x:p.x+dx,y:p.y+dy};out.push(st);
    }
  });
  return out;
}
function robust(sp){
  let bad=0;
  for(const st of neighbours(sp))if(!allLit(evalRaw(assemble(sp,st)).res)&&++bad>sp.allowFail)return false;
  return true;
}
function tune(sp){
  const maxJ=Math.max(...sp.goals.map(g=>g.rl.length),1);
  for(let j=0;j<maxJ;j++){
    for(const g of sp.goals){g.p.r=g.rl[Math.min(j,g.rl.length-1)];if(!g.dark&&!sp.fixedNeed)g.p.need=0.03}
    if(sp.hook&&!sp.hook(j))continue;
    let res=evalRaw(assemble(sp)).res;
    if(!allLit(res))continue;
    if(!sp.fixedNeed){
      sp.goals.forEach((g,i)=>{if(g.dark)return;const t=0.6*res[i].pct;let n=NICE[0];for(const v of NICE)if(v<=t)n=v;g.p.need=n});
      res=evalRaw(assemble(sp)).res;
      if(!allLit(res))continue;
    }
    if(robust(sp))return true;
  }
  return false;
}

// ---------- scatter movables into a start state
function freeSpot(rnd,sp,taken,minD){
  for(let t=0;t<120;t++){
    const x=5*ri(rnd,12,188),y=5*ri(rnd,12,108);
    if(sp.fix.some(f=>f.t==='wall'&&wallPtDist(f,x,y)<50))continue;
    if(sp.emit.some(e=>Math.hypot(e.x-x,e.y-y)<80))continue;
    if(sp.goals.some(g=>Math.hypot(g.p.x-x,g.p.y-y)<(g.p.r||15)+60))continue;
    if(sp.fix.some(f=>f.t!=='wall'&&Math.hypot(f.x-x,f.y-y)<80))continue;
    if(taken.some(q=>Math.hypot(q.x-x,q.y-y)<minD))continue;
    return [x,y];
  }
  return null;
}
function scatter(rnd,sp){
  const taken=sp.decoys.map(d=>({x:d.x,y:d.y})),st=[];
  for(const m of sp.mov){
    const p=m.p;
    if(m.startPos){st.push({x:m.startPos[0],y:m.startPos[1],a:p.a,ax:p.ax});taken.push({x:m.startPos[0],y:m.startPos[1]});continue}
    let pos=null;
    for(let t=0;t<30&&!pos;t++){
      const q=freeSpot(rnd,sp,taken,95);
      if(q&&Math.hypot(q[0]-p.x,q[1]-p.y)>=110)pos=q;
    }
    if(!pos)return null;
    taken.push({x:pos[0],y:pos[1]});
    const s={x:pos[0],y:pos[1],a:p.a,ax:p.ax};
    if(!DISCT[p.t]&&!p.norot&&p.t!=='prism'){
      let a;do{a=15*ri(rnd,-5,6)}while(Math.abs(m180(a-p.a))<30);s.a=a;
    }
    if(p.t==='prism')s.a=5*ri(rnd,0,23);
    if(DIALV[p.t]&&p.ax!==undefined){
      let v;do{v=pick(rnd,DIALV[p.t])}while(v===p.ax);s.ax=v;
    }
    st.push(s);
  }
  return st;
}
function decoyPieces(rnd,sp,types,count){
  const taken=[];
  for(let i=0;i<count;i++){
    const q=freeSpot(rnd,sp,taken,95);if(!q)return false;
    taken.push({x:q[0],y:q[1]});
    const t=pick(rnd,types);
    sp.decoys.push({t,x:q[0],y:q[1],a:15*ri(rnd,-5,6)});
  }
  return true;
}

function finish(rnd,sp,meta){
  snapMov(sp);
  for(const g of sp.goals){g.p.x=r5(g.p.x);g.p.y=r5(g.p.y)}
  for(const e of sp.emit){e.x=r5(e.x);e.y=r5(e.y)}
  if(!tune(sp))return null;
  const st=scatter(rnd,sp);if(!st)return null;
  if(solved(sp,st))return null;
  // every movable must matter
  for(let i=0;i<sp.mov.length;i++){
    const t=sp.mov.map((m,k)=>k===i?st[k]:null).map((s,k)=>s||{x:sp.mov[k].p.x,y:sp.mov[k].p.y,a:sp.mov[k].p.a,ax:sp.mov[k].p.ax});
    if(solved(sp,t))return null;
  }
  const pieces=assemble(sp,st);
  const base=sp.emit.length+sp.fix.length,sol={};
  sp.mov.forEach((m,i)=>{
    const p=m.p,a=DISCT[p.t]?0:p.a,e=[Math.round(p.x*10)/10,Math.round(p.y*10)/10,a];
    if(p.ax!==undefined&&DIALV[p.t])e.push(p.ax);
    sol[base+i]=e;
  });
  const lv={name:meta.name,hint:meta.hint,pieces,sol};
  if(meta.pol)lv.pol=1;
  if(meta.coh)lv.coh=1;
  return lv;
}

function famRelay(rnd,c){

  const T=Math.min(6,c+1+ri(rnd,0,1));
  const tree=growTree(rnd,{turns:T,minL:c>3?100:120,maxL:c>3?250:300});
  if(!tree)return null;
  const sp=newSpec();
  const band=pick(rnd,[RED,GRN,BLU]);

        addMov(sp,Object.assign(p,{x:px,y:py}),{startPos:[ox,oy]});

    }else makeGoal(sp,goalPiece(n,fb||band,fb?{ex:1}:{}),[13,16,20,25]);
  }

function famSorter(rnd,c){
  const m=[1,2,2,3,3][c-1];
  const tree=growTree(rnd,{splits:m,turns:Math.min(3,c-1+ri(rnd,0,1)),minL:120,maxL:260,tries:900});
  if(!tree)return null;
  const sp=newSpec();sp.emit.push(emitterAt(tree,WHITE));
  const count=nd=>nd.k==='goal'?1:nd.k==='turn'?count(nd.next):count(nd.a)+count(nd.b);
  const bands=new Map();
  const edge=i=>i<=0?400:(i>=NW1?700:WL[i]-3.8);
  const NW1=WL.length-1;
  const assign=(nd,lo,hi)=>{
    if(nd.k==='goal'){bands.set(nd,[lo,hi]);return}
    if(nd.k==='turn'){assign(nd.next,lo,hi);return}
    const na=count(nd.a),nb=count(nd.b),tot=hi-lo+1,wb=Math.round(tot*nb/(na+nb));
    if(wb<5||tot-wb<5){bands.fail=true;return}

  };
  assign(tree.first,0,NW1);if(bands.fail)return null;
  const toBand=r=>[r[0]<=0?400:WL[r[0]]-3.8,r[1]>=NW1?700:WL[r[1]]+3.8];
  addTreePieces(sp,tree,{
    branch:(n,a)=>addMov(sp,{t:'dichro',x:n.x,y:n.y,a,band:toBand(n.refl)}),
    goal:n=>makeGoal(sp,goalPiece(n,toBand(bands.get(n)),{ex:1}),[13,16,20,25])

  const keep={legs:legList(tree),pts:nodePts(tree,80),walls:[]};
  const gs=tree.nodes.filter(n=>n.k==='goal');

  if(c>=4&&rnd()<0.5)decoyPieces(rnd,sp,['mirror'],1);
  return {sp,meta:{name:pickName(rnd,'sorter'),hint:HINT.sorter}};
}

function famCombine(rnd,c){
  const nc=c>=4?3:2;
  const bandsAll=shuffle(rnd,[RED,GRN,BLU]).slice(0,nc);
  // common beam: tree chain after the merge point
  const T=Math.min(3,c-1+ri(rnd,0,1));
  const tree=growTree(rnd,{turns:T,minL:140,maxL:260,firstL:5*ri(rnd,40,56)});
  if(!tree)return null;
  const leg0=tree.legs[0],d=dv(tree.d0);
  const sp=newSpec();
  sp.emit.push(emitterAt(tree,bandsAll[0]));
  // dichroics sit on the first leg, side emitters feed them
  const spts=[0.45,0.8].slice(0,nc-1);
  const sides=[];
  for(let k=0;k<nc-1;k++){
    const u=leg0.len*spts[k],px=leg0.x1+d[0]*u,py=leg0.y1+d[1]*u;
    const sd=pick(rnd,[-1,1]),din=n360(tree.d0+sd*90);
    // beam from side emitter travels toward the dichroic, straight along din
    const L=5*ri(rnd,34,56),ex=px-Math.cos(din*R)*L,ey=py-Math.sin(din*R)*L;
    if(!inB(ex,ey,40))return null;
    sides.push({px,py,din,ex,ey});
    sp.emit.push({t:'emit',x:ex,y:ey,a:din,band:bandsAll[k+1],fixed:1});
    addMov(sp,{t:'dichro',x:px,y:py,a:turnMirror(din,tree.d0),band:bandsAll[k+1]});
  }
  // check side emitter spacing against everything
  for(const s of sides){
    if(tree.nodes.some(n=>Math.hypot(n.x-s.ex,n.y-s.ey)<90))return null;
    if(Math.hypot(tree.sx-s.ex,tree.sy-s.ey)<120)return null;
    for(const l of tree.legs.slice(1))if(pSeg(s.ex,s.ey,l.x1,l.y1,l.x2,l.y2)<60)return null;
  }
  if(sides.length===2&&Math.hypot(sides[0].ex-sides[1].ex,sides[0].ey-sides[1].ey)<100)return null;
  for(const n of tree.nodes){
    if(n.k==='turn')addMov(sp,mirrorPiece(n));
    else makeGoal(sp,goalPiece(n,WHITE,{bands:bandsAll.slice()}),[16,20,25,30],{});
  }
  for(const g of sp.goals)delete g.p.band;
  const last=tree.legs[tree.legs.length-1],ld=dv(last.d);
  // slot walls across the last leg
  const sl=ri(rnd,0,1),u0=last.len*0.55;
  const cx=last.x1+ld[0]*u0,cy=last.y1+ld[1]*u0,gapW=5*ri(rnd,14,18),hw=5*ri(rnd,30,40);
  const nx=-ld[1],ny=ld[0];
  const wa=Math.round(last.d/5)*5;
  const w1={t:'wall',x:Math.round(cx+nx*(gapW/2+hw/2)),y:Math.round(cy+ny*(gapW/2+hw/2)),w:30,h:hw,a:wa,fixed:1};
  const w2={t:'wall',x:Math.round(cx-nx*(gapW/2+hw/2)),y:Math.round(cy-ny*(gapW/2+hw/2)),w:30,h:hw,a:wa,fixed:1};
  if(!wallInBoard(w1)||!wallInBoard(w2))return null;
  void sl;
  sp.fix.push(w1,w2);
  const keep={legs:legList(tree).concat(sides.map(s=>({x1:s.ex,y1:s.ey,x2:s.px,y2:s.py}))),pts:nodePts(tree,80),walls:[w1,w2]};
  addWalls(rnd,sp,keep,c<3?0:1,null);
  keep.walls=sp.fix.filter(w=>w.t==='wall');
  return {sp,meta:{name:pickName(rnd,'combine'),hint:HINT.combine}};
}

function famFocus(rnd,c,zoom){
  const S=c>=4?1:0,T=Math.min(4,c-1+ri(rnd,0,1));
  const tree=growTree(rnd,{splits:S,turns:T,minL:150,maxL:280,legGap:70,tries:900});
  if(!tree)return null;
  const sp=newSpec(),band=pick(rnd,[RED,GRN,BLU]);
  const w=5*ri(rnd,8,14);
  sp.emit.push(emitterAt(tree,band,{w,nb:9}));
  const f=zoom?pick(rnd,[100,130,170,230,340]):pick(rnd,c<2?[160]:[100,120,160,200,240,300]);
  addTreePieces(sp,tree,{
    branch:(n,a)=>addMov(sp,{t:'split',x:n.x,y:n.y,a}),
    goal:n=>{
      makeGoal(sp,goalPiece(n,band,{show:1}),[7,9,12,15,19]);
      // lens f before the goal, walking back along the chain
      let rem=f,cur=n,pos=null;
      for(let g=0;g<6;g++){
        const leg=tree.legs.find(l=>l.to===cur);
        const along=leg.len-rem;
        if(along>=75&&rem>=75){const d=dv(leg.d);pos={x:leg.x1+d[0]*along,y:leg.y1+d[1]*along,d:leg.d};break}
        if(along>=75&&rem<75)break;
        rem-=leg.len;cur=cur.par;
        if(!cur||cur.k==='branch')break;
      }
      if(!pos){sp.bad=true;return}
      if(zoom)addMov(sp,{t:'zlens',x:pos.x,y:pos.y,a:r5(m180(pos.d+90)),ax:E.ZF.indexOf(f)*22.5});
      else addMov(sp,{t:'lens',x:pos.x,y:pos.y,a:r5(m180(pos.d+90)),f});
    }
  });
  if(sp.bad)return null;
  for(const m of sp.mov)if(/lens$/.test(m.p.t))for(const o of sp.mov)if(o!==m&&!/lens$/.test(o.p.t)&&Math.hypot(o.p.x-m.p.x,o.p.y-m.p.y)<80)return null;
  const gs=tree.nodes.filter(n=>n.k==='goal');
  const keep={legs:legList(tree),pts:nodePts(tree,80).concat(sp.mov.filter(m=>/lens$/.test(m.p.t)).map(m=>[m.p.x,m.p.y,60])),walls:[]};
  addWalls(rnd,sp,keep,c<3?1:2,[tree.sx,tree.sy,gs[0].x,gs[0].y],w/2);
  return {sp,meta:{name:pickName(rnd,zoom?'zoom':'focus'),hint:zoom?HINT.zoom:HINT.focus}};
}


function famSpread(rnd,c){
  const f=-pick(rnd,c<2?[90]:[60,75,90,110,140]);
  const u1=5*ri(rnd,16,30),Dg=5*ri(rnd,60,90);

  const lens=zoom?{t:'zlens',x:lx,y:ly,a:r5(m180(l0.d+90)),ax:E.ZF.indexOf(pick(rnd,[-60,-80,-100,-130]))*22.5}:{t:'lens',x:lx,y:ly,a:r5(m180(l0.d+90)),f};

  for(const o of offs){

// Black holes: the beam is bent by gravity, so the path is found by simulation. The mirrors go
// where the bent beam arrives, and the level checks that the same layout fails with no hole.
function pathOf(tr,iw){return tr.rays.filter(q=>q.i===iw).map(q=>[q.x1,q.y1,q.x2,q.y2])}
function pathLen(p){return p.reduce((a,s)=>a+Math.hypot(s[2]-s[0],s[3]-s[1]),0)}
function pointAt(p,sArc){
  let acc=0;
  for(const s of p){
    const l=Math.hypot(s[2]-s[0],s[3]-s[1]);
    if(acc+l>=sArc&&l>0){const f=(sArc-acc)/l;return {x:s[0]+(s[2]-s[0])*f,y:s[1]+(s[3]-s[1])*f,ang:Math.atan2(s[3]-s[1],s[2]-s[0])/R}}
    acc+=l;
  }
  return null;
}
function closestArc(p,bh){
  let acc=0,best=1e9,bs=0;
  for(const s of p){
    const l=Math.hypot(s[2]-s[0],s[3]-s[1]),d=pSeg(bh.x,bh.y,s[0],s[1],s[2],s[3]);
    if(d<best){best=d;bs=acc+l/2}
    acc+=l;
  }
  return {arc:bs,d:best};
}
function famHole(rnd,c){
  const sp=newSpec(),rainbow=rnd()<0.5;
  const band=rainbow?WHITE:pick(rnd,[RED,GRN,BLU]);
  const iw=rainbow?ri(rnd,8,32):(band===RED?30:band===GRN?18:8);
  const rs=5*ri(rnd,3,5);
  const bhs=[{t:'bh',x:5*ri(rnd,70,130),y:5*ri(rnd,45,75),r:rs,fixed:1}];
  if(c>=4&&rnd()<0.6){
    const q={t:'bh',x:5*ri(rnd,50,150),y:5*ri(rnd,30,90),r:5*ri(rnd,2,3),fixed:1};
    if(Math.hypot(q.x-bhs[0].x,q.y-bhs[0].y)>260)bhs.push(q);
  }
  const bh=bhs[0],b=rs*rr(rnd,3,7)*(rnd()<0.5?-1:1);
  const nPre=c>=3?ri(rnd,0,1):0,nPost=c<=1?1:(c<=3?ri(rnd,1,2):2);
  // incoming beam passes the hole at offset b
  const d1=10*ri(rnd,-6,6)+(rnd()<0.5?0:180),dd=dv(d1),pn=[-dd[1],dd[0]];
  const D1=5*ri(rnd,50,80);
  let ex,ey,pre=null;
  if(nPre===0){ex=bh.x-dd[0]*D1+pn[0]*b;ey=bh.y-dd[1]*D1+pn[1]*b}
  else{
    const P=[bh.x-dd[0]*D1+pn[0]*b,bh.y-dd[1]*D1+pn[1]*b],t=pick(rnd,TURNS),d0=n360(d1-t),L0=5*ri(rnd,40,60),v0=dv(d0);
    ex=P[0]-v0[0]*L0;ey=P[1]-v0[1]*L0;
    pre={x:P[0],y:P[1],a:turnMirror(d0,d1)};
  }
  if(!inB(ex,ey,40)||(pre&&!inB(pre.x,pre.y,50)))return null;
  const d0=nPre===0?d1:n360(d1-0);
  const em={t:'emit',x:ex,y:ey,a:nPre===0?d1:Math.atan2(pre.y-ey,pre.x-ex)/R,band,fixed:1};
  sp.emit.push(em);
  for(const q of bhs)sp.fix.push(q);
  if(pre)addMov(sp,{t:'mirror',x:pre.x,y:pre.y,a:pre.a});
  void d0;
  snapMov(sp);for(const e of sp.emit){e.x=r5(e.x);e.y=r5(e.y)}
  const run=()=>evalRaw(assemble(sp));
  let tr=run(),path=pathOf(tr,iw),sPrev=0;
  const minD=()=>Math.min(...bhs.map(q=>closestArc(path,q).d));
  const safe=rainbow?1.6:1.4;
  if(path.length<3||minD()<rs*safe)return null;
  let sArc=closestArc(path,bh).arc;
  const nodes=[[ex,ey,70]].concat(bhs.map(q=>[q.x,q.y,q.r*3+40]));
  if(pre)nodes.push([pre.x,pre.y,90]);
  for(let k=0;k<nPost;k++){
    let placed=false;
    for(let tr2=0;tr2<14&&!placed;tr2++){
      const s=Math.max(sArc,sPrev)+rr(rnd,130,280),pt=pointAt(path,s);
      if(!pt||!inB(pt.x,pt.y,60))continue;
      if(bhs.some(q=>Math.hypot(pt.x-q.x,pt.y-q.y)<q.r*3+60))continue;
      if(nodes.some(n=>Math.hypot(pt.x-n[0],pt.y-n[1])<110))continue;
      const t=pick(rnd,TURNS),a=turnMirror(pt.ang,pt.ang+t);
      const mx=r5(pt.x),my=r5(pt.y);
      sp.mov.push({p:{t:'mirror',x:mx,y:my,a}});
      const t2=run(),p2=pathOf(t2,iw);
      if(p2.length<3||Math.min(...bhs.map(q=>closestArc(p2,q).d))<rs*safe){sp.mov.pop();continue}
      path=p2;sPrev=s;placed=true;nodes.push([mx,my,90]);
    }
    if(!placed)return null;
  }
  // goal on the final leg
  let goal=null;
  for(let t=0;t<20&&!goal;t++){
    const pt=pointAt(path,sPrev+rr(rnd,150,300));
    if(!pt||!inB(pt.x,pt.y,45))continue;
    if(bhs.some(q=>Math.hypot(pt.x-q.x,pt.y-q.y)<q.r*3+50))continue;
    if(nodes.some(n=>Math.hypot(pt.x-n[0],pt.y-n[1])<95))continue;
    goal=pt;
  }
  if(!goal)return null;
  makeGoal(sp,{t:'goal',x:goal.x,y:goal.y,band,r:18,fixed:1,...(rainbow?{ex:1}:{})},rainbow?[10,12,14,17,20,24,28]:[16,19,23,28]);
  sp.allowFail=2;
  if(rainbow)sp.hook=()=>{
    const gp=sp.goals[0].p;gp.band=WHITE;gp.need=0.03;delete gp.ex;
    const tr2=evalRaw(assemble(sp)),arr=new Set();
    for(const q of tr2.rays)if(Math.hypot(q.x2-gp.x,q.y2-gp.y)<=gp.r+0.5)arr.add(q.i);
    if(arr.size<4||arr.size>16)return false;
    const a=[...arr],lo2=Math.min(...a),hi2=Math.max(...a);
    gp.band=[Math.max(400,WL[lo2]-1),Math.min(700,WL[hi2]+1)];gp.ex=1;
    return true;
  };
  // gravity must matter: with the holes gone the layout must not light the target
  const t0=evalRaw(assemble(sp).filter(q=>q.t!=='bh'));
  if(allLit(t0.res))return null;
  const keep={legs:path.map(s=>({x1:s[0],y1:s[1],x2:s[2],y2:s[3]})),pts:nodes.concat([[goal.x,goal.y,60]]),walls:[]};
  addWalls(rnd,sp,keep,c<3?0:1,null);
  return {sp,meta:{name:pickName(rnd,'hole'),hint:rainbow?HINT.holeRainbow:HINT.hole}};
}

function famPinhole(rnd,c){

  const T=c<3?0:Math.min(2,c-2);
  const need=70+f1+f2+90;
  const tree=growTree(rnd,{turns:T,firstL:need+5*ri(rnd,0,12),minL:150,maxL:260,legGap:70,tries:900});
  if(!tree)return null;

  const gapW=5*ri(rnd,6,9),hw=5*ri(rnd,30,40),nx=-d[1],ny=d[0],wa=Math.round(l0.d/5)*5;
  const w1={t:'wall',x:Math.round(slit.x+nx*(gapW/2+hw/2)),y:Math.round(slit.y+ny*(gapW/2+hw/2)),w:30,h:hw,a:wa,fixed:1};
  const w2={t:'wall',x:Math.round(slit.x-nx*(gapW/2+hw/2)),y:Math.round(slit.y-ny*(gapW/2+hw/2)),w:30,h:hw,a:wa,fixed:1};
  if(!wallInBoard(w1)||!wallInBoard(w2))return null;

  const before=sp.fix.length;
  addWalls(rnd,sp,keep,c<3?0:1,null,wBeam/2);
  void before;
  return {sp,meta:{name:pickName(rnd,'pinhole'),hint:HINT.pinhole}};
}

function famPolChain(rnd,c){
  const opts=c<2?[[0,1]]:c<4?[[0,1],[0,3],[0,2]]:[[0,3],[0,2],[0,3]];
  const [,k]=pick(rnd,opts);
  const th0=pick(rnd,[0,22.5,45,67.5,90,112.5,135,157.5]);
  const thf=(th0+90)%180;
  const T=Math.min(4,c-1+ri(rnd,0,1));
  const tree=growTree(rnd,{turns:T,minL:210,maxL:300,tries:900});
  if(!tree)return null;
  const sp=newSpec();sp.meta.pol=1;
  sp.emit.push(emitterAt(tree,MONO,{pol:th0}));
  for(const n of tree.nodes){
    if(n.k==='turn')addMov(sp,mirrorPiece(n));
    else makeGoal(sp,goalPiece(n,MONO,{show:1}),[15,18,22]);
  }
  const lastLeg=tree.legs[tree.legs.length-1],dl=dv(lastLeg.d);
  // analyzer fixed 90 deg from the source, 80 before the goal

function famPolSplit(rnd,c){
  const m=c<3?1:2;

  if(!tree)return null;
  const sp=newSpec();
  const th0=pick(rnd,[0,45,90,135]);
  sp.emit.push(emitterAt(tree,MONO,{pol:th0}));
  const polIn=new Map();
  const walk=(nd,pol)=>{
    if(nd.k==='goal')return;
    if(nd.k==='turn'){walk(nd.next,pol);return}
    // branch: choose axis & offset so (alpha+off+pol)/2 is on the dial grid
    for(let t=0;t<60;t++){
      const alpha=pick(rnd,DIALV.pbs),off=pick(rnd,c<3?[45]:[45,22.5,67.5]);
      const h=(alpha+off+pol)/2;
      for(const hax of [h,h+90]){
        const hm=((hax%180)+180)%180;
        if(Math.abs(hm/22.5-Math.round(hm/22.5))<1e-9){nd.alpha=alpha;nd.hax=hm;break}
      }
      if(nd.alpha!==undefined)break;
    }
    if(nd.alpha===undefined){sp.bad=true;return}
    walk(nd.a,nd.alpha);walk(nd.b,(nd.alpha+90)%180);
  };
  walk(tree.first,th0);if(sp.bad)return null;
  const hspots=[];
  addTreePieces(sp,tree,{
    branch:(n,a)=>{
      addMov(sp,{t:'pbs',x:n.x,y:n.y,a,ax:n.alpha});
      const leg=tree.legs.find(l=>l.to===n),d=dv(leg.d),u=leg.len-95;
      if(u<70){sp.bad=true;return}
      hspots.push([leg.x1+d[0]*u,leg.y1+d[1]*u]);
      addMov(sp,{t:'hwp',x:leg.x1+d[0]*u,y:leg.y1+d[1]*u,a:0,ax:n.hax,r:30});
    },
    goal:n=>makeGoal(sp,goalPiece(n,MONO,{show:1}),[15,18,22])
  });
  if(sp.bad)return null;
  const keep={legs:legList(tree),pts:nodePts(tree,80).concat(hspots.map(h=>[h[0],h[1],60])),walls:[]};
  const gs=tree.nodes.filter(n=>n.k==='goal');
  addWalls(rnd,sp,keep,c<3?1:2,[tree.sx,tree.sy,gs[0].x,gs[0].y]);
  sp.meta.pol=1;
  return {sp,meta:{name:pickName(rnd,'polsplit'),hint:HINT.polsplit,pol:1}};
}

function flipSpec(sp,fx,fy){
  const f=p=>{
    if(fx){p.x=W-p.x;p.a=180-(p.a||0);if(p.startPos)p.startPos[0]=W-p.startPos[0];if(p.rail!==undefined)p.rail=180-p.rail}
    if(fy){p.y=H-p.y;p.a=-(p.a||0);if(p.rail!==undefined)p.rail=-p.rail}
    if(p.a!==undefined&&!DISCT[p.t])p.a=m180(p.a)
  };
  sp.emit.forEach(f);sp.fix.forEach(f);sp.mov.forEach(m=>{f(m.p);if(m.startPos){if(fx)m.startPos[0]=W-m.startPos[0];if(fy)m.startPos[1]=H-m.startPos[1]}});
  sp.decoys.forEach(f);sp.goals.forEach(g=>f(g.p));
}
function searchDials(rnd,sp,idx,cap){
  const sols=[],lists=idx.map(i=>DIALV[sp.mov[i].p.t]);
  const total=lists.reduce((a,l)=>a*l.length,1);
  const cur=sp.mov.map(m=>({x:m.p.x,y:m.p.y,a:m.p.a,ax:m.p.ax}));
  const rec=k=>{
    if(sols.length>=cap)return;
    if(k===idx.length){if(allLit(evalRaw(assemble(sp,cur)).res))sols.push(idx.map(i=>cur[i].ax));return}
    for(const v of lists[k]){cur[idx[k]].ax=v;rec(k+1)}
  };
  rec(0);void total;
  return sols;
}
function famMZ(rnd,c){
  const x0=25*ri(rnd,8,14),y0=25*ri(rnd,3,5),y1=y0+25*ri(rnd,9,13);
  const x1=x0+25*ri(rnd,14,Math.min(24,Math.floor((830-x0)/25)-x0/25*0));
  if(x1>830||y1>450||x1-x0<350)return null;
  const ex=25*ri(rnd,2,3),sp=newSpec();
  sp.coh=1;
  sp.emit.push({t:'emit',x:ex*4,y:y0,a:0,band:MONO,fixed:1});
  sp.fix.push({t:'split',x:x0,y:y0,a:45,fixed:1},{t:'mirror',x:x1,y:y0,a:45,fixed:1},{t:'split',x:x1,y:y1,a:45,fixed:1},{t:'mirror',x:x0,y:y1,a:45,fixed:1});
  // arms: top y0, bottom y1 (x0..x1), left x0, right x1
  const arm=()=>{
    const k=ri(rnd,0,3);
    if(k===0)return [x0+25*ri(rnd,3,Math.max(3,(x1-x0)/25-3)),y0];
    if(k===1)return [x0+25*ri(rnd,3,Math.max(3,(x1-x0)/25-3)),y1];
    if(k===2)return [x0,y0+25*ri(rnd,2,Math.max(2,(y1-y0)/25-2))];

  };
  const nFixed=c>=3?ri(rnd,1,2):0,nMov=c<2?1:c<4?2:3;
  const pts=[];
  const free=p=>pts.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>=65);
  const place=()=>{for(let t=0;t<30;t++){const p=arm();if(free(p)){pts.push(p);return p}}return null};
  for(let i=0;i<nFixed;i++){const p=place();if(!p)return null;sp.fix.push({t:'phase',x:p[0],y:p[1],a:0,ax:pick(rnd,DIALV.phase.slice(1)),fixed:1})}
  const idx=[];
  for(let i=0;i<nMov;i++){const p=place();if(!p)return null;idx.push(sp.mov.length);addMov(sp,{t:'phase',x:p[0],y:p[1],a:0,ax:0})}
  const port=pick(rnd,['R','B']),gR={x:x1+200,y:y1},gB={x:x1,y:y1+105};

  sp.coh=1;

  if(fx||fy)flipSpec(sp,fx,fy);
  return {sp,meta:{name:pickName(rnd,'mz'),hint:mode==='bright'?'Delay an arm so the beams arrive in step at the lit port.':HINT.mz,coh:1}};
}

function famMich(rnd,c){
  const sx=25*ri(rnd,10,16),sy=25*ri(rnd,8,12);
  const La=25*ri(rnd,8,13),Lb=25*ri(rnd,5,8),Lc=25*ri(rnd,6,8);
  const sp=newSpec();
  sp.coh=1;
  if(sy-Lc<60||sy+Lb>560||sx+La>940)return null;
  sp.emit.push({t:'emit',x:sx-25*ri(rnd,6,9),y:sy,a:0,band:MONO,fixed:1});
  sp.fix.push({t:'split',x:sx,y:sy,a:45,fixed:1});
  const ta=5*ri(rnd,8,20)*pick(rnd,[-1,1]),tb=5*ri(rnd,8,20)*pick(rnd,[-1,1]);
  // rail A slides along x, mirror faces the beam; rail B slides along y
  addMov(sp,{t:'mirror',x:sx+La,y:sy,a:90,rail:0,range:150,norot:1},{startPos:[sx+La-ta,sy]});
  addMov(sp,{t:'mirror',x:sx,y:sy+Lb,a:0,rail:90,range:150,norot:1},{startPos:[sx,sy+Lb-tb]});
  sp.mov[0].p.x=sx+La;sp.mov[1].p.y=sy+Lb;
  makeGoal(sp,{t:'goal',x:sx,y:sy-Lc,band:MONO,coh:1,r:15,need:0.8,show:1,fixed:1},[15]);
  sp.fixedNeed=true;
  if(c>=2&&rnd()<0.8){
    // a fixed phase plate in one arm, a movable one in the other
    const k=pick(rnd,[0,1]);
    if(k===0)sp.fix.push({t:'phase',x:sx+La/2,y:sy,a:0,ax:pick(rnd,DIALV.phase.slice(1)),fixed:1});
    else sp.fix.push({t:'phase',x:sx,y:sy+Lb/2,a:0,ax:pick(rnd,DIALV.phase.slice(1)),fixed:1});
  }
  // rails: starts/solutions. find a solution by scanning rail positions
  const m0=sp.mov[0],m1=sp.mov[1];
  const base0={x:m0.p.x,y:m0.p.y,a:m0.p.a},base1={x:m1.p.x,y:m1.p.y,a:m1.p.a};
  const found=[];
  for(let t0=-100;t0<=100;t0+=25)for(let t1=-150;t1<=150&&found.length<8;t1+=5){
    const st=[{x:base0.x+t0,y:base0.y,a:base0.a},{x:base1.x,y:base1.y+t1,a:base1.a}];
    if(allLit(evalRaw(assemble(sp,st)).res))found.push([t0,t1]);
  }
  if(!found.length)return null;
  const [t0,t1]=pick(rnd,found);
  m0.p.x=base0.x+t0;m1.p.y=base1.y+t1;
  // rail origin is the start position; keep the solution within reach of it
  m0.startPos=[m0.p.x-ta,sy];m1.startPos=[sx,m1.p.y-tb];
  const fx=rnd()<0.5,fy=rnd()<0.5;
  if(fx||fy)flipSpec(sp,fx,fy);
  return {sp,meta:{name:pickName(rnd,'mich'),hint:HINT.mich,coh:1}};
}


function famGlass(rnd,c,kind){
  const sp=newSpec();
  const ex=5*ri(rnd,14,24),ey=5*ri(rnd,30,90),d0=pick(rnd,[-20,-10,0,10,20]);
  const d=dv(d0),D=5*ri(rnd,35,65),off=5*ri(rnd,-8,8);
  const orb=kind==='orb',gr=orb?5*ri(rnd,8,12):60;
  const offs=orb?(rnd()<0.5?-1:1)*5*Math.round(rr(rnd,0.45,0.9)*gr/5):off;
  const px=ex+d[0]*D-d[1]*offs,py=ey+d[1]*D+d[0]*offs;
  if(!inB(px,py,80))return null;
  const prism=orb?{t:'orb',x:px,y:py,a:0,r:gr,norot:1}:{t:'prism',x:px,y:py,a:5*ri(rnd,0,23),r:60};
  const em={t:'emit',x:ex,y:ey,a:d0,band:WHITE,fixed:1};
  const pr=clone(prism);
  const t0=evalRaw([em,pr]);
  const lastSeg=i=>{const r=t0.rays.filter(q=>q.i===i);return r.length>=3?r[r.length-1]:null};
  const lo=lastSeg(3),hi=lastSeg(36);
  if(!lo||!hi)return null;
  const ang=q=>Math.atan2(q.y2-q.y1,q.x2-q.x1)/R;
  if(Math.abs(m180(ang(lo)-ang(hi)))<4)return null;
  const iw=ri(rnd,8,32),seg=lastSeg(iw);if(!seg)return null;
  let sx=seg.x1,sy=seg.y1,dir=ang(seg);
  const nm=c<=2?ri(rnd,0,1):(c<5?ri(rnd,1,2):2);
  sp.emit.push(em);addMov(sp,prism);
  if(orb)sp.allowFail=2;
  const pts=[[px,py,80],[ex,ey,70]];
  const legs=[{x1:ex,y1:ey,x2:px,y2:py}];
  for(let k=0;k<nm;k++){
    const L=rr(rnd,130,260),dd=dv(dir),qx=sx+dd[0]*L,qy=sy+dd[1]*L;
    if(!inB(qx,qy,60))return null;
    const t=pick(rnd,TURNS),a=turnMirror(dir,dir+t),u=dv(a);
    const dot=dd[0]*u[0]+dd[1]*u[1],rx=2*dot*u[0]-dd[0],ry=2*dot*u[1]-dd[1];
    addMov(sp,{t:'mirror',x:qx,y:qy,a});

  const dd=dv(dir),Lg=rr(rnd,170,300),gx=sx+dd[0]*Lg,gy=sy+dd[1]*Lg;

  for(const q of pts)if(Math.hypot(q[0]-gx,q[1]-gy)<90)return null;
  legs.push({x1:sx,y1:sy,x2:gx,y2:gy});
  const g={t:'goal',x:gx,y:gy,band:WHITE,r:12,ex:1,show:0,fixed:1};
  makeGoal(sp,g,[10,12,14,17,20,24]);
  sp.hook=()=>{
    const gp=sp.goals[0].p;gp.band=WHITE;gp.need=0.03;delete gp.ex;
    const tr=evalRaw(assemble(sp));
    const arr=new Set();
    for(const q of tr.rays)if(Math.hypot(q.x2-gp.x,q.y2-gp.y)<=gp.r+0.5)arr.add(q.i);
    if(arr.size<4||arr.size>16)return false;
    const a=[...arr];const lo2=Math.min(...a),hi2=Math.max(...a);

    return true;
  };

  return {sp,meta:{name:pickName(rnd,orb?'orb':'prism'),hint:orb?HINT.orb:HINT.prism}};
}

// ---------- public
// make(seed,tier,family?) -> level or null. Tier 1..5.
function make(seed,tier,family,maxTries){
  const rnd=mulberry(seed*7919+tier*104729);
  const fams=family?[family]:familiesFor(tier);
  for(let t=0;t<(maxTries||160);t++){
    const f=family||pick(rnd,fams);
    let r=null;
    try{r=FAMS[f](rnd,tier)}catch(e){r=null}
    if(!r)continue;
    // interferometers and rails carry their own state
    r.sp.meta=Object.assign({},r.sp.meta,r.meta);
    const lv=finish(rnd,r.sp,{name:r.meta.name,hint:r.meta.hint,pol:r.sp.meta.pol||r.meta.pol,coh:r.sp.coh||r.meta.coh});
    if(lv){lv.family=f;return lv}
  }
  return null;
}
return {make,FAMS,familiesFor,mulberry};
}

    ctx.lineCap='butt';ctx.strokeStyle=bandColor(p.band,0.9);ctx.lineWidth=8;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;line(s.x1,s.y1,s.x2,s.y2);
  }else if(p.t==='dichro'){
    ctx.strokeStyle='#59627f';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=5;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.2;line(s.x1,s.y1,s.x2,s.y2);
  }else if(DISC[p.t]){
    drawDisc(p);
  }else if(p.t==='pbs'){
    ctx.strokeStyle='#2f5a55';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#9fe3d0';ctx.lineWidth=4;ctx.setLineDash([9,5]);line(s.x1,s.y1,s.x2,s.y2);ctx.setLineDash([]);
    badge(p.x,p.y,p.ax,'#9fe3d0');
  }else if(p.t==='emit'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.fillStyle='#161b28';ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=3;
    ctx.beginPath();ctx.rect(-14,-12,26,24);ctx.fill();ctx.stroke();
    ctx.fillStyle=bandColor(p.band,1);ctx.beginPath();ctx.moveTo(12,-6);ctx.lineTo(20,0);ctx.lineTo(12,6);ctx.fill();
    ctx.restore();
    if(LV.pol)badge(p.x,p.y-26,p.pol,'#ffffff',9);
  }
}
function draw(time){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
  ctx.fillStyle='#0d1018';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1b2132';
  for(let x=50;x<W;x+=50)for(let y=50;y<H;y+=50)ctx.fillRect(x-1,y-1,2,2);
  ctx.strokeStyle='#262c3d';ctx.lineWidth=2;ctx.strokeRect(0,0,W,H);
  for(const p of pieces)if(p.rail!==undefined){
    const r=p.rail*D2R,c=Math.cos(r),s=Math.sin(r);
    ctx.strokeStyle='rgba(127,214,255,.28)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
    line(p.ox-c*p.range,p.oy-s*p.range,p.ox+c*p.range,p.oy+s*p.range);ctx.setLineDash([]);
  }
  for(const p of pieces)if(p.t==='wall'){
    polyPath(segsOf(p));ctx.fillStyle='#1a1f2e';ctx.fill();ctx.strokeStyle='#3a4360';ctx.lineWidth=2;ctx.stroke();
  }
  for(const p of pieces)if(p.t==='prism'||p.t==='orb'){polyPath(segsOf(p));ctx.fillStyle='rgba(150,200,255,0.10)';ctx.fill()}
  if(lastTrace){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    const step=Math.max(6,(lastTrace.totalLen||0)/5000),coh=!!LV.coh;
    for(const pass of [0,1]){
      for(const r of lastTrace.rays){
        const c=RGBF[r.ci!==undefined?r.ci:r.i*SUB]||RGB[r.i],a=Math.min(1,r.I*r.K);
        ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(pass?0.5*a:0.07*a)+')';
        ctx.lineWidth=pass?2.2:8;
        const dx=r.x2-r.x1,dy=r.y2-r.y1,L=Math.hypot(dx,dy);
        if(pass===1&&wavy&&L>12){
          const ux=dx/L,uy=dy/L,k=2*Math.PI/(WL[r.i]/LG),A=(coh?7:3)*Math.sqrt(a);
          const n=Math.max(2,Math.ceil(L/step));
          ctx.beginPath();
          for(let j=0;j<=n;j++){
            const sd=L*j/n,tp=Math.min(1,sd/8,(L-sd)/8);
            const o=A*tp*Math.sin((coh?r.ph0:r.vp0)+k*r.n*sd-k*WSPEED*time);
            const X=r.x1+ux*sd-uy*o,Y=r.y1+uy*sd+ux*o;
            if(j)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);
          }
          ctx.stroke();
        }else line(r.x1,r.y1,r.x2,r.y2);
      }
    }
    ctx.globalCompositeOperation='source-over';
  }
  for(const p of pieces){
    drawPiece(p);marks(p);
    if(p===sel){
      ctx.strokeStyle='rgba(127,214,255,.9)';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.arc(p.x,p.y,radius(p)+10,0,7);ctx.stroke();ctx.setLineDash([]);
      if(DIALS[p.t]){
        const D=DIALS[p.t],k=dialPos(p);
        ctx.strokeStyle='rgba(255,210,122,.55)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.arc(p.x,p.y,dialR(p),0,7);ctx.stroke();ctx.setLineDash([]);
        if(p.t!=='phase'){ctx.strokeStyle='rgba(255,210,122,.8)';ctx.lineWidth=2;line(2*p.x-k.x,2*p.y-k.y,k.x,k.y)}
        ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(k.x,k.y,ui(9),0,7);ctx.fill();
        ctx.fillStyle='#ffd27a';ctx.font='600 '+Math.round(ui(13))+'px system-ui,sans-serif';ctx.textAlign='center';
        ctx.fillText(dialLabel(p),p.x,p.y+radius(p)+ui(26));
      }
      if(p.t==='bh'&&!p.fixed){
        ctx.strokeStyle='rgba(255,210,122,.7)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(p.x+p.r,p.y,ui(9),0,7);ctx.fill();
        ctx.font='600 13px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Size '+p.r,p.x,p.y+p.r*1.5+24);
      }
      if(!p.norot){
        const h=handlePos(p);
        ctx.strokeStyle='rgba(127,214,255,.5)';line(p.x,p.y,h.x,h.y);
        ctx.fillStyle='#7fd6ff';ctx.beginPath();ctx.arc(h.x,h.y,ui(9),0,7);ctx.fill();
        if(mode==='rot'){ctx.font='600 '+Math.round(ui(13))+'px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(fmt(((p.a/D2R%360)+360)%360),h.x,h.y-ui(16))}
      }
    }
  }
  if(guides)drawGuides();
  drawHints();
  if(lastTrace&&LV.pol){
    for(const r of lastTrace.rays){
      if(r.i!==lastTrace.minI||r.I<0.04)continue;
      const L=Math.hypot(r.x2-r.x1,r.y2-r.y1);
      if(L<130)continue;
      ctx.globalAlpha=Math.min(1,0.35+r.I);
      badge((r.x1+r.x2)/2,(r.y1+r.y2)/2,r.pol/D2R,'rgba(255,255,255,.85)',8);
      ctx.globalAlpha=1;
    }
  }
  let gi=0;
  for(const p of pieces)if(p.t==='goal'){
    const rs=lastTrace?lastTrace.res[gi]:{prog:0,pct:0,lit:false,bad:false};gi++;
    if(rs.lit){
      ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      g.addColorStop(0,bandColor(p.band||p.bands[0],0.8));g.addColorStop(1,bandColor(p.band||p.bands[0],0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
    const gb=p.band||(p.bands?[400,700]:[400,700]);
    const gcol=p.bands?'rgba(255,255,255,1)':bandColor(gb,1);
    ctx.fillStyle=rs.lit?(p.bands?'rgba(255,255,255,.95)':bandColor(gb,0.95)):'#0d1018';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    ctx.strokeStyle=rs.bad?'#ff6b6b':gcol;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
    const fill=p.show&&!p.dark?Math.min(1,rs.pct/(p.need||0.2)):rs.prog;
    if(!rs.lit&&fill>0&&!p.dark){
      ctx.strokeStyle=gcol;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+7,-Math.PI/2,-Math.PI/2+fill*Math.PI*2);ctx.stroke();
    }
    if(p.ex||p.dark){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,7);ctx.stroke()}
    if(p.show){
      let txt;
      if(p.dark)txt=rs.lit?'100%':(rs.bad?'too bright':'no light');
      else txt=Math.round((rs.lit?1:Math.min(0.99,rs.pct/(p.need||0.2)))*100)+'%';
      const below=p.y+p.r+24<=H;
      const y1=below?p.y+p.r+20:p.y-p.r-10;
      ctx.textAlign='center';ctx.font='600 14px system-ui,sans-serif';
      ctx.fillStyle=rs.lit?'#6fe3a0':(rs.bad?'#ff8a8a':'#aab3c8');
      ctx.fillText(txt,p.x,y1);
    }
  }
  ctx.restore();
}
function frame(t){
  const redraw=dirty;
  if(dirty){
    lastTrace=trace(pieces);dirty=false;
    let tl=0;for(const r of lastTrace.rays)tl+=Math.hypot(r.x2-r.x1,r.y2-r.y1);
    lastTrace.totalLen=tl;
    const all=lastTrace.res.length>0&&lastTrace.res.every(r=>r.lit);
    if(all){if(!litSince)litSince=t}else litSince=0;
  }
  if(redraw||wavy)draw(t/1000);
  if(!solved&&!sandbox&&litSince&&t-litSince>500)win();
  requestAnimationFrame(frame);
}
resize();
let start=0;
if(done.length){start=Math.min(LEVELS.length-1,Math.max(...done)+1)}
const qp=new URLSearchParams(location.search);
if(qp.get('sandbox'))sbxStart(false);
else if(qp.get('gen')){
  const [gf,gt,gs]=qp.get('gen').split(':'),lv=GEN.make(+gs||1,+gt||1,gf||undefined);
  if(lv){cur=-1;endless={tier:+gt||1,seed:+gs||1};begin(lv)}else load(start);
}else{
  if(qp.get('level'))start=Math.max(0,Math.min(LEVELS.length-1,+qp.get('level')-1));
  load(start);
}
requestAnimationFrame(frame);
})();
</script>
