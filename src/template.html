<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Refract</title>
<style>
:root{--bg:#0a0c12;--panel:#12151f;--line:#262c3d;--ink:#e8ecf6;--dim:#8d96ad;--acc:#7fd6ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header,footer{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
header{justify-content:space-between}
h1{font-size:16px;font-weight:600;margin:0;text-align:center;flex:1;letter-spacing:.01em;min-width:0}
h1 small{display:block;font-weight:400;color:var(--dim);font-size:12px;line-height:1.3}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
footer{justify-content:center;min-height:58px;flex-wrap:wrap}
.grp{display:none;gap:8px;align-items:center}
.grp.on{display:flex}
#sbx{display:none;flex:none;flex-wrap:wrap;gap:6px;padding:6px 12px;justify-content:center;border-top:1px solid var(--line);max-height:30vh;overflow:auto}
#sbx.on{display:flex}
#sbx button{padding:5px 9px;font-size:13px;min-height:32px;border-radius:8px}
#sbx .sep{width:1px;background:var(--line);margin:0 2px}
#sbx .del{border-color:#7a3d3d}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,12,.74);z-index:5;padding:12px}
#over.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:min(94vw,540px);width:100%;max-height:92%;overflow:auto;text-align:center}
.card h2{margin:0 0 6px;font-size:22px;font-weight:600}
.card h3{margin:14px 0 8px;font-size:14px;font-weight:600;text-align:left;color:var(--acc)}
.card p{color:var(--dim);margin:0 0 16px;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{display:flex;flex-direction:column;gap:2px;padding:8px 2px;min-width:0}
.grid b{font-size:17px;font-weight:600}
.grid span{font-size:10px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.grid .done{border-color:#3d7a57}
.grid .done b::after{content:" \2713";color:#6fe3a0;font-size:13px}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pri{background:var(--acc);color:#05202e;border-color:var(--acc);font-weight:600}
</style></head>
<body>
<header>
  <button id="bMenu" aria-label="Levels">Levels</button>
  <h1 id="title"></h1>
  <button id="bReset" aria-label="Reset level">Reset</button>
</header>
<div id="stage"><canvas id="cv"></canvas>
  <div id="over"><div class="card" id="card"></div></div>
</div>
<div id="sbx"></div>
<footer>
  <button id="bHint" aria-label="Show a hint">Hint</button>
  <button id="bWave" aria-label="Toggle wave animation">Waves: on</button>
  <button id="bGuide" aria-label="Toggle guides">Guides: on</button>
  <div id="rot" class="grp"><button id="rL" aria-label="Turn left">Turn left</button><button id="rR" aria-label="Turn right">Turn right</button></div>
</footer>
<script>
/*ENGINE*/
/*LEVELS*/
/*GENLEVELS*/
/*GEN*/
(function(){
LEVELS.push(...GEN_LEVELS);
const GEN=makeGen({normalize,trace,WL,W,H,ZF});
const CH0=[];{let s0=0;CHAPTERS.forEach(c=>{CH0.push(s0);s0+=c.n||5})}
function chapterOf(n){let c=0;while(c+1<CH0.length&&n>=CH0[c+1])c++;return c}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let sc=1,ox=0,oy=0,dpr=1,cw=0,ch=0;
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let wavy=!reduce,guides=true;
try{if(localStorage.getItem('refract-guides')==='0')guides=false}catch(e){}
try{const v=localStorage.getItem('refract-wave');if(v==='0')wavy=false;else if(v==='1')wavy=true}catch(e){}
const WSPEED=70;
let hinted=[],cur=0,pieces=[],sel=null,mode=null,off={x:0,y:0},dirty=true,lastTrace=null,litSince=0,solved=false;
let done=[];const introSeen={};
try{done=JSON.parse(localStorage.getItem('refract-done')||'[]')}catch(e){done=[]}
function saveDone(){try{localStorage.setItem('refract-done',JSON.stringify(done))}catch(e){}}
const RGB=WL.map(wlRGB).map(c=>c.map(v=>Math.min(255,Math.round(v*0.88+28))));
let LV=LEVELS[0],endless=null,etier=1,ecount=0;
try{const e=JSON.parse(localStorage.getItem('refract-endless')||'{}');etier=e.tier||1;ecount=e.n||0}catch(e){}
function saveEndless(){try{localStorage.setItem('refract-endless',JSON.stringify({tier:etier,n:ecount}))}catch(e){}}
function begin(lv){
  LV=lv;sandbox=!!lv.sandbox;hinted=[];solved=false;litSince=0;sel=null;
  pieces=JSON.parse(JSON.stringify(lv.pieces)).map(normalize);
  $('sbx').classList.toggle('on',sandbox);$('bHint').style.display=sandbox?'none':'';
  sbxBar();resize();
  $('title').innerHTML=(sandbox?'':endless?'\u221e ':(cur+1)+'. ')+lv.name+'<small>'+lv.hint+(endless?' \u00b7 seed '+endless.seed:'')+'</small>';
  $('over').classList.remove('on');updateCtl();dirty=true;
}
function load(n){
  cur=n;endless=null;begin(LEVELS[n]);
  const c=chapterOf(n);
  if(n===CH0[c]&&c>0&&!done.includes(n)&&!introSeen[c]){
    introSeen[c]=1;
    card('<h2>Chapter '+(c+1)+': '+CHAPTERS[c].name+'</h2><p>'+CHAPTERS[c].intro+'</p><div class="row"><button class="pri" id="iOk">Got it</button></div>');
    $('iOk').onclick=()=>$('over').classList.remove('on');
  }
}
function loadEndless(tier,seed){
  etier=tier;saveEndless();
  card('<h2>Making a puzzle</h2><p>One moment.</p>');
  setTimeout(()=>{
    let lv=null,sd=seed;
    for(let k=0;k<30&&!lv;k++,sd++)lv=GEN.make(sd,tier);
    if(!lv){card('<h2>No luck</h2><p>The generator came up empty. Try again.</p><div class="row"><button class="pri" id="eAgain">Try again</button></div>');$('eAgain').onclick=()=>loadEndless(tier,Math.floor(Math.random()*1e6)+1);return}
    cur=-1;endless={tier,seed:sd-1};begin(lv);
  },30);
}
function restart(){if(sandbox)sbxStart(true);else if(endless)begin(LV);else load(cur)}
// ---- sandbox: every piece, no goal required
const RED_=[620,700],GRN_=[520,570],BLU_=[420,480];
const BANDS={
  emit:[[400,700],RED_,GRN_,BLU_,[595,605],[400,490],[560,700]],
  filter:[RED_,GRN_,BLU_,[400,490],[560,700],[400,610]],
  dichro:[[610,700],[400,490],[495,608],[400,610],[495,700]],
  goal:[[400,700],RED_,GRN_,BLU_,[595,605]]
};
const BNAME=b=>b[0]<=400&&b[1]>=700?'White':b[0]===595?'Laser':b[1]>=700&&b[0]>=600?'Red':b[0]>=500&&b[1]<=600&&b[0]<560?'Green':b[1]<=500?'Blue':'Mix';
const MK={
  emit:()=>({t:'emit',a:0,band:[400,700]}),
  mirror:()=>({t:'mirror',a:45}),
  split:()=>({t:'split',a:45}),
  prism:()=>({t:'prism',a:0}),
  orb:()=>({t:'orb'}),
  lens:()=>({t:'lens',a:90,f:160}),
  concave:()=>({t:'lens',a:90,f:-100}),
  zlens:()=>({t:'zlens',a:90}),
  filter:()=>({t:'filter',a:90,band:RED_}),
  dichro:()=>({t:'dichro',a:45,band:[610,700]}),
  pol:()=>({t:'pol',ax:0}),
  hwp:()=>({t:'hwp',ax:0}),
  pbs:()=>({t:'pbs',a:45,ax:0}),
  phase:()=>({t:'phase',ax:0}),
  wall:()=>({t:'wall',w:30,h:160,a:0}),
  goal:()=>({t:'goal',band:[400,700],r:15,show:1})
};
const PAL=[['emit','Light'],['mirror','Mirror'],['split','Splitter'],['prism','Prism'],['orb','Glass ball'],['lens','Convex lens'],['concave','Concave lens'],['zlens','Zoom lens'],['filter','Filter'],['dichro','Dichroic'],['pol','Polarizer'],['hwp','Waveplate'],['pbs','Pol. splitter'],['phase','Phase plate'],['wall','Wall'],['goal','Target']];
const FLIST=[-200,-120,-80,80,120,160,240,320];
let sandbox=false;
function sbxSave(){
  try{
    const list=pieces.map(p=>{const q=JSON.parse(JSON.stringify(p));q.a=p.a/D2R;delete q.kd;return q});
    localStorage.setItem('refract-sandbox',JSON.stringify(list));
  }catch(e){}
}
function sbxStart(fresh){
  let list=null;
  if(!fresh)try{list=JSON.parse(localStorage.getItem('refract-sandbox'))}catch(e){}
  if(!Array.isArray(list)||!list.length)list=[{t:'emit',x:110,y:300,a:0,band:[400,700]},{t:'prism',x:420,y:300,a:0}];
  cur=-1;endless=null;
  begin({name:'Sandbox',hint:'Add any piece from the bar. Drag to move, turn with the blue dot, and use Delete to remove.',pieces:list,sol:{},pol:1,coh:1,sandbox:1});
}
function sbxBar(){
  const bar=$('sbx');
  if(sandbox){LV.pol=pieces.some(p=>p.t==='pol'||p.t==='hwp'||p.t==='pbs'||(p.t==='emit'&&p.pol))?1:0;LV.coh=pieces.some(p=>p.t==='phase'||(p.t==='emit'&&p.band[0]===595))?1:0;dirty=true}
  if(!sandbox){bar.innerHTML='';return}
  let h='';
  for(const [k,n] of PAL)h+='<button data-add="'+k+'">'+n+'</button>';
  h+='<span class="sep"></span>';
  if(sel){
    h+='<button class="del" data-act="del">Delete</button>';
    if(BANDS[sel.t])h+='<button data-act="band">Color: '+BNAME(sel.band)+'</button>';
    if(sel.t==='emit'){
      h+='<button data-act="wide">Beam: '+(sel.w?'wide':'narrow')+'</button>';
      h+='<button data-act="pol">Polarization '+fmt(sel.pol||0)+'</button>';
    }
    if(sel.t==='lens')h+='<button data-act="focal">Focal length '+fmtF(sel.f)+'</button>';
  }
  h+='<button data-act="clear">Clear all</button>';
  bar.innerHTML=h;
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>sbxDo(b.dataset.add,b.dataset.act));
}
function sbxDo(add,act){
  if(add){
    const spots=[[500,300],[500,180],[500,420],[360,300],[640,300],[360,180],[640,420],[300,470],[700,150],[200,200],[800,300]];
    const pt=spots.find(s=>!pieces.some(p=>Math.hypot(p.x-s[0],p.y-s[1])<70))||[500,300];
    const q=MK[add]();q.x=pt[0];q.y=pt[1];
    const p=normalize(q);pieces.push(p);sel=p;
  }else if(act==='del'&&sel){pieces.splice(pieces.indexOf(sel),1);sel=null}
  else if(act==='clear'){pieces=[];sel=null}
  else if(sel&&act==='band'){const L=BANDS[sel.t],i=L.findIndex(b=>b[0]===sel.band[0]&&b[1]===sel.band[1]);sel.band=L[(i+1)%L.length]}
  else if(sel&&act==='wide'){if(sel.w){sel.w=0;sel.nb=1}else{sel.w=60;sel.nb=9}}
  else if(sel&&act==='pol'){sel.pol=((sel.pol||0)+22.5)%180}
  else if(sel&&act==='focal'){const i=FLIST.indexOf(sel.f);sel.f=FLIST[(i+1)%FLIST.length]}
  updateCtl();dirty=true;sbxSave();sbxBar();
}

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=r.width;ch=r.height;cv.width=cw*dpr;cv.height=ch*dpr;
  const pad=8;sc=Math.min((cw-pad*2)/W,(ch-pad*2)/H);
  ox=(cw-W*sc)/2;oy=(ch-H*sc)/2;dirty=true;
}
window.addEventListener('resize',resize);
function toW(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}}
function radius(p){return p.r!==undefined?p.r:p.t==='emit'?20:p.t==='wall'?Math.max(p.w,p.h)/2:p.len/2}
function dialR(p){return p.r!==undefined?p.r:p.t==='zlens'?46:26}
function handlePos(p){const hr=radius(p)+28;return{x:p.x+Math.cos(p.a)*hr,y:p.y+Math.sin(p.a)*hr}}
function dialPos(p){
  const a=(p.t==='phase'?p.ax-90:(p.kd!==undefined?p.kd:p.ax))*D2R;
  const R=dialR(p);return{x:p.x+Math.cos(a)*R,y:p.y+Math.sin(a)*R};
}
function distSeg(px,py,p){
  const c=Math.cos(p.a),s=Math.sin(p.a),h=p.len/2;
  let t=((px-p.x)*c+(py-p.y)*s);t=Math.max(-h,Math.min(h,t));
  return Math.hypot(px-(p.x+c*t),py-(p.y+s*t));
}
function hit(p,w){
  if(p.fixed)return false;
  if(p.t==='emit')return Math.hypot(w.x-p.x,w.y-p.y)<26;
  if(p.t==='wall'){const dx=w.x-p.x,dy=w.y-p.y,c=Math.cos(p.a),s=Math.sin(p.a),u=dx*c+dy*s,v=-dx*s+dy*c;return Math.abs(u)<=p.w/2+8&&Math.abs(v)<=p.h/2+8}
  if(p.r!==undefined)return Math.hypot(w.x-p.x,w.y-p.y)<p.r*0.95;
  if(!p.len)return false;
  return distSeg(w.x,w.y,p)<(sc<0.7?26:20);
}
const FRAC={0:'no delay',45:'1/8 wave',90:'1/4 wave',135:'3/8 wave',180:'1/2 wave',225:'5/8 wave',270:'3/4 wave',315:'7/8 wave'};
function fmtF(f){return Math.abs(f)>=500?'flat':(f>0?'+':'')+f}
function dialLabel(p){
  if(p.t==='zlens')return 'Focal length '+fmtF(zf(p));
  if(p.t==='phase')return 'Delay '+fmt(p.ax)+' ('+(FRAC[p.ax]||'')+')';
  return 'Axis '+fmt(p.ax);
}
function fmt(v){return (Math.round(v*10)/10)+'\u00b0'}
function updateCtl(){
  $('rot').classList.toggle('on',!!sel&&!sel.norot);
}
cv.addEventListener('pointerdown',e=>{
  if(solved)return;
  cv.setPointerCapture(e.pointerId);
  const w=toW(e);
  if(sel&&DIALS[sel.t]){const k=dialPos(sel);if(Math.hypot(w.x-k.x,w.y-k.y)<30/Math.max(sc,0.5)){mode='dial';return}}
  if(sel&&!sel.norot){const h=handlePos(sel);if(Math.hypot(w.x-h.x,w.y-h.y)<32/Math.max(sc,0.5)){mode='rot';return}}
  let f=null;
  for(let i=pieces.length-1;i>=0;i--)if(hit(pieces[i],w)){f=pieces[i];break}
  sel=f;
  if(f){mode='move';off={x:w.x-f.x,y:w.y-f.y}}else mode=null;
  updateCtl();dirty=true;if(sandbox)sbxBar();
});
cv.addEventListener('pointermove',e=>{
  if(!sel||!mode)return;
  const w=toW(e);
  if(mode==='dial'){
    const D=DIALS[sel.t];
    let g=Math.atan2(w.y-sel.y,w.x-sel.x)/D2R;
    if(sel.t==='phase')g+=90;
    if(sel.t==='phase'){g=((g%360)+360)%360;sel.ax=(Math.round(g/D.step)*D.step)%360}
    else{g=((g%360)+360)%360;g=(Math.round(g/D.step)*D.step)%360;sel.kd=g;sel.ax=g%D.mod}
    dirty=true;return;
  }
  if(mode==='rot'){
    let a=Math.atan2(w.y-sel.y,w.x-sel.x);
    if(!e.shiftKey){const st=5*D2R;a=Math.round(a/st)*st}
    sel.a=a;
  }else if(sel.rail!==undefined){
    const r=sel.rail*D2R,c=Math.cos(r),s=Math.sin(r);
    let t=(w.x-off.x-sel.ox)*c+(w.y-off.y-sel.oy)*s;
    t=Math.max(-sel.range,Math.min(sel.range,t));t=Math.round(t/5)*5;
    sel.x=sel.ox+c*t;sel.y=sel.oy+s*t;
  }else{
    sel.x=Math.max(30,Math.min(W-30,Math.round((w.x-off.x)/5)*5));
    sel.y=Math.max(30,Math.min(H-30,Math.round((w.y-off.y)/5)*5));
  }
  dirty=true;
});
const endDrag=()=>{if(mode&&sandbox)sbxSave();mode=null;if(sandbox)sbxBar()};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{if(sel&&!sel.norot){e.preventDefault();turn(e.deltaY>0?5:-5)}},{passive:false});
function turn(d){if(!sel||sel.norot)return;sel.a+=d*D2R;dirty=true;if(sandbox)sbxSave()}
function dial(d){
  if(!sel||!DIALS[sel.t])return;
  const D=DIALS[sel.t];sel.ax=(((sel.ax+d*D.step)%D.mod)+D.mod)%D.mod;sel.kd=sel.ax;
  updateCtl();dirty=true;if(sandbox)sbxSave();
}
$('rL').onclick=()=>turn(-5);$('rR').onclick=()=>turn(5);
window.addEventListener('keydown',e=>{
  const s=e.shiftKey?1:5;
  if(e.key==='q'||e.key==='ArrowLeft')turn(-s);
  else if(e.key==='e'||e.key==='ArrowRight')turn(s);
  else if(e.key==='['||e.key==='ArrowDown')dial(-1);
  else if(e.key===']'||e.key==='ArrowUp')dial(1);
  else if(e.key==='r')restart();
  else if(sandbox&&sel&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();sbxDo(null,'del')}
  else if(e.key==='Escape'){sel=null;updateCtl();dirty=true}
});
$('bReset').onclick=restart;
function waveLbl(){$('bWave').textContent='Waves: '+(wavy?'on':'off')}
$('bWave').onclick=()=>{wavy=!wavy;try{localStorage.setItem('refract-wave',wavy?'1':'0')}catch(e){}waveLbl();dirty=true};
function guideLbl(){$('bGuide').textContent='Guides: '+(guides?'on':'off')}
$('bGuide').onclick=()=>{guides=!guides;try{localStorage.setItem('refract-guides',guides?'1':'0')}catch(e){}guideLbl();dirty=true};
guideLbl();
waveLbl();
function unmatched(){
  const sol=LV.sol,out=[];
  for(const k in sol){
    const p=pieces[+k],t=sol[k];
    const m=p.t==='prism'?120:180;
    let ok=Math.hypot(p.x-t[0],p.y-t[1])<=10;
    if(ok&&!DISC[p.t]&&!p.norot){const d=((p.a/D2R-t[2])%m+m+m/2)%m-m/2;ok=Math.abs(d)<=6}
    if(ok&&t.length>3)ok=Math.abs(p.ax-t[3])<1;
    if(!ok)out.push({k:+k,p,t});
  }
  return out;
}
$('bHint').onclick=()=>{
  const next=unmatched().find(u=>!hinted.includes(u.k));
  if(next)hinted.push(next.k);else hinted=[];
  dirty=true;
};
function arcBetween(x,y,r,a,b){
  let d=((b-a+3*Math.PI)%(2*Math.PI))-Math.PI;
  if(Math.abs(d)<0.03)return;
  ctx.beginPath();ctx.arc(x,y,r,a,a+d,d<0);ctx.stroke();
}
function drawGuides(){
  ctx.lineCap='round';
  for(const p of pieces)if((p.t==='lens'||p.t==='zlens')&&Math.abs(p.t==='zlens'?zf(p):p.f)<500){
    const nx=-Math.sin(p.a),ny=Math.cos(p.a),f=Math.abs(p.t==='zlens'?zf(p):p.f);
    ctx.font='600 11px system-ui,sans-serif';ctx.textAlign='center';
    for(const sgn of [-1,1]){
      const x=p.x+nx*f*sgn,y=p.y+ny*f*sgn;
      ctx.strokeStyle='rgba(215,232,255,.55)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.stroke();
      ctx.fillStyle='rgba(215,232,255,.7)';ctx.fillText('F',x+nx*sgn*0+10,y-8);
    }
  }
  if(!lastTrace||!lastTrace.ev)return;
  for(const e of lastTrace.ev){
    if(e.i!==lastTrace.refI)continue;
    ctx.setLineDash([4,5]);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.2;
    line(e.x-e.nx*30,e.y-e.ny*30,e.x+e.nx*30,e.y+e.ny*30);ctx.setLineDash([]);
    ctx.lineWidth=2.2;
    ctx.strokeStyle='#7fd6ff';
    arcBetween(e.x,e.y,17,Math.atan2(e.ny,e.nx),Math.atan2(-e.dy,-e.dx));
    ctx.strokeStyle='#ffd27a';
    if(e.tir)arcBetween(e.x,e.y,24,Math.atan2(e.ny,e.nx),Math.atan2(e.oy,e.ox));
    else arcBetween(e.x,e.y,24,Math.atan2(-e.ny,-e.nx),Math.atan2(e.oy,e.ox));
  }
}
function drawHints(){
  if(!hinted.length)return;
  const list=unmatched().filter(u=>hinted.includes(u.k));
  for(const {p,t} of list){
    const g=Object.assign({},p,{x:t[0],y:t[1],a:t[2]*D2R,fixed:1});
    if(t.length>3)g.ax=t[3];
    ctx.save();ctx.globalAlpha=0.6;drawPiece(g);ctx.restore();
    ctx.strokeStyle='#ffd27a';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.arc(g.x,g.y,radius(g)+8,0,7);ctx.stroke();ctx.setLineDash([]);
    if(t.length>3&&DIALS[g.t]){
      ctx.fillStyle='#ffd27a';ctx.font='600 13px system-ui,sans-serif';ctx.textAlign='center';
      ctx.fillText(dialLabel(g),g.x,g.y-radius(g)-14);
    }
  }
}
function card(html){$('card').innerHTML=html;$('over').classList.add('on')}
function menu(){
  let g='<h2>Refract</h2><p>Steer light into every target. Each chapter adds a new kind of optics.</p>';
  CHAPTERS.forEach((c,ci)=>{
    g+='<h3>Chapter '+(ci+1)+': '+c.name+'</h3><div class="grid">';
    for(let i=CH0[ci];i<CH0[ci]+(c.n||5);i++)g+='<button data-i="'+i+'" class="'+(done.includes(i)?'done':'')+'"><b>'+(i+1)+'</b><span>'+LEVELS[i].name+'</span></button>';
    g+='</div>';
  });
  g+='<h3>Sandbox</h3><p>Every piece, no goals. Build anything and watch the light.</p><div class="row"><button id="mSbx">Open sandbox</button></div>';
  g+='<h3>Endless</h3><p>New puzzles, made on the spot. Pick a difficulty.'+(ecount?' Solved so far: '+ecount+'.':'')+'</p><div class="grid">';
  CHAPTERS.slice(5).forEach((c,k)=>{g+='<button data-t="'+(k+1)+'"><b>'+(k+1)+'</b><span>'+c.name+'</span></button>'});
  g+='</div><div class="row"><button id="mClose" class="pri">Close</button></div>';
  card(g);
  document.querySelectorAll('.grid button[data-i]').forEach(b=>b.onclick=()=>load(+b.dataset.i));
  document.querySelectorAll('.grid button[data-t]').forEach(b=>b.onclick=()=>loadEndless(+b.dataset.t,Math.floor(Math.random()*1e6)+1));
  $('mSbx').onclick=()=>sbxStart(false);
  $('mClose').onclick=()=>$('over').classList.remove('on');
}
$('bMenu').onclick=menu;
function win(){
  solved=true;
  if(endless){
    ecount++;saveEndless();
    card('<h2>Solved</h2><p>Every target is lit. Puzzles solved: '+ecount+'.</p><div class="row"><button id="wRe">Replay</button><button id="wMenu">Levels</button><button id="wNext" class="pri">Next puzzle</button></div>');
    $('wRe').onclick=()=>restart();$('wMenu').onclick=menu;
    $('wNext').onclick=()=>loadEndless(endless.tier,Math.floor(Math.random()*1e6)+1);
    return;
  }
  if(!done.includes(cur)){done.push(cur);saveDone()}
  const last=cur===LEVELS.length-1;
  card('<h2>Solved</h2><p>'+(last?'That was the last level. Replay any from the menu, or try Endless.':'Every target is lit.')+'</p><div class="row"><button id="wRe">Replay</button>'+(last?'<button id="wMenu" class="pri">Levels</button>':'<button id="wNext" class="pri">Next level</button>')+'</div>');
  $('wRe').onclick=()=>load(cur);
  if(last)$('wMenu').onclick=menu;else $('wNext').onclick=()=>load(cur+1);
}
function bandColor(b,a){
  if(b[0]<=400&&b[1]>=700)return 'rgba(255,255,255,'+a+')';
  const c=wlRGB((b[0]+b[1])/2);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function badge(x,y,deg,col,rad){
  rad=rad||11;const a=deg*D2R;
  ctx.fillStyle='#10141e';ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();ctx.stroke();
  ctx.lineWidth=2.2;ctx.lineCap='round';
  line(x-Math.cos(a)*(rad-4),y-Math.sin(a)*(rad-4),x+Math.cos(a)*(rad-4),y+Math.sin(a)*(rad-4));
}
function phaseBadge(x,y,deg,col){
  ctx.fillStyle='#10141e';ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.stroke();
  if(deg>0){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,8,-Math.PI/2,-Math.PI/2+deg*D2R);ctx.closePath();ctx.fill()}
}
function polyPath(sg){ctx.beginPath();ctx.moveTo(sg[0].x1,sg[0].y1);sg.forEach(s=>ctx.lineTo(s.x2,s.y2));ctx.closePath()}
function drawLens(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
  const h=p.len/2,f=p.t==='zlens'?zf(p):p.f,str=Math.min(1,110/Math.abs(f)),bu=3+14*str;ctx.beginPath();
  if(f>0){ctx.moveTo(-h,0);ctx.quadraticCurveTo(0,-bu,h,0);ctx.quadraticCurveTo(0,bu,-h,0)}
  else{const t=10,c=t-8*str;ctx.moveTo(-h,-t);ctx.quadraticCurveTo(0,-c,h,-t);ctx.lineTo(h,t);ctx.quadraticCurveTo(0,c,-h,t);ctx.closePath()}
  ctx.fillStyle='rgba(150,200,255,0.2)';ctx.fill();
  ctx.strokeStyle='rgba(215,232,255,0.95)';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  ctx.restore();
}
function drawDisc(p){
  const col=p.t==='pol'?'#c9d4f0':p.t==='hwp'?'#ffd27a':'#c8a6ff';
  ctx.save();
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
  ctx.fillStyle='rgba(16,20,30,.82)';ctx.fill();
  ctx.clip();
  if(p.t==='phase'){
    ctx.fillStyle='rgba(200,166,255,.45)';ctx.beginPath();ctx.moveTo(p.x,p.y);
    ctx.arc(p.x,p.y,p.r,-Math.PI/2,-Math.PI/2+p.ax*D2R);ctx.closePath();ctx.fill();
  }else{
    const a=p.ax*D2R,c=Math.cos(a),s=Math.sin(a);
    ctx.strokeStyle=col;ctx.lineWidth=p.t==='hwp'?3:1.6;ctx.globalAlpha=.85;
    for(let o=-p.r;o<=p.r;o+=p.t==='hwp'?9:6){
      line(p.x-s*o-c*p.r*1.2,p.y+c*o-s*p.r*1.2,p.x-s*o+c*p.r*1.2,p.y+c*o+s*p.r*1.2);
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.strokeStyle=col;ctx.lineWidth=p.t==='hwp'?4:2.5;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
}
function bolt(x,y){
  ctx.fillStyle='#2a3144';ctx.strokeStyle='#9aa3ba';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();ctx.stroke();
  ctx.lineWidth=1.2;line(x-2.2,y-2.2,x+2.2,y+2.2);
}
function marks(p){
  if(p.fixed&&(p.t==='wall'||p.t==='emit'||p.t==='goal'))return;
  if(p.fixed){
    if(p.t==='prism'){segsOf(p).forEach(s=>bolt(s.x1,s.y1))}
    else if(p.t==='orb'){for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;bolt(p.x+Math.cos(a)*p.r,p.y+Math.sin(a)*p.r)}}
    else if(DISC[p.t]){for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;bolt(p.x+Math.cos(a)*p.r,p.y+Math.sin(a)*p.r)}}
    else if(p.len){const s=segsOf(p)[0];bolt(s.x1,s.y1);bolt(s.x2,s.y2)}
  }else{
    ctx.fillStyle='#10141e';ctx.strokeStyle='#7fd6ff';ctx.lineWidth=2.2;
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7fd6ff';ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill();
  }
}
function drawPiece(p){
  if(p.t==='prism'||p.t==='orb'){
    polyPath(segsOf(p));ctx.strokeStyle='rgba(205,228,255,0.85)';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();return;
  }
  if(p.t==='lens'||p.t==='zlens'){drawLens(p);return}
  if(!p.len&&p.t!=='emit'&&!DISC[p.t])return;
  const s=p.len?segsOf(p)[0]:null;
  ctx.lineCap='round';
  if(p.t==='mirror'){
    ctx.strokeStyle='#59627f';ctx.lineWidth=9;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#eef3ff';ctx.lineWidth=4;line(s.x1,s.y1,s.x2,s.y2);
  }else if(p.t==='split'){
    ctx.strokeStyle='#3d6a8a';ctx.lineWidth=9;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#bfe6ff';ctx.lineWidth=4;ctx.setLineDash([7,7]);line(s.x1,s.y1,s.x2,s.y2);ctx.setLineDash([]);
  }else if(p.t==='filter'){
    ctx.lineCap='butt';ctx.strokeStyle=bandColor(p.band,0.9);ctx.lineWidth=8;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;line(s.x1,s.y1,s.x2,s.y2);
  }else if(p.t==='dichro'){
    ctx.strokeStyle='#59627f';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=5;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.2;line(s.x1,s.y1,s.x2,s.y2);
  }else if(DISC[p.t]){
    drawDisc(p);
  }else if(p.t==='pbs'){
    ctx.strokeStyle='#2f5a55';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#9fe3d0';ctx.lineWidth=4;ctx.setLineDash([9,5]);line(s.x1,s.y1,s.x2,s.y2);ctx.setLineDash([]);
    badge(p.x,p.y,p.ax,'#9fe3d0');
  }else if(p.t==='emit'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.fillStyle='#161b28';ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=3;
    ctx.beginPath();ctx.rect(-14,-12,26,24);ctx.fill();ctx.stroke();
    ctx.fillStyle=bandColor(p.band,1);ctx.beginPath();ctx.moveTo(12,-6);ctx.lineTo(20,0);ctx.lineTo(12,6);ctx.fill();
    ctx.restore();
    if(LV.pol)badge(p.x,p.y-26,p.pol,'#ffffff',9);
  }
}
function draw(time){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
  ctx.fillStyle='#0d1018';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1b2132';
  for(let x=50;x<W;x+=50)for(let y=50;y<H;y+=50)ctx.fillRect(x-1,y-1,2,2);
  ctx.strokeStyle='#262c3d';ctx.lineWidth=2;ctx.strokeRect(0,0,W,H);
  for(const p of pieces)if(p.rail!==undefined){
    const r=p.rail*D2R,c=Math.cos(r),s=Math.sin(r);
    ctx.strokeStyle='rgba(127,214,255,.28)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
    line(p.ox-c*p.range,p.oy-s*p.range,p.ox+c*p.range,p.oy+s*p.range);ctx.setLineDash([]);
  }
  for(const p of pieces)if(p.t==='wall'){
    polyPath(segsOf(p));ctx.fillStyle='#1a1f2e';ctx.fill();ctx.strokeStyle='#3a4360';ctx.lineWidth=2;ctx.stroke();
  }
  for(const p of pieces)if(p.t==='prism'||p.t==='orb'){polyPath(segsOf(p));ctx.fillStyle='rgba(150,200,255,0.10)';ctx.fill()}
  if(lastTrace){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    const step=Math.max(6,(lastTrace.totalLen||0)/5000),coh=!!LV.coh;
    for(const pass of [0,1]){
      for(const r of lastTrace.rays){
        const c=RGB[r.i],a=Math.min(1,r.I*r.K);
        ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(pass?0.5*a:0.07*a)+')';
        ctx.lineWidth=pass?2.2:8;
        const dx=r.x2-r.x1,dy=r.y2-r.y1,L=Math.hypot(dx,dy);
        if(pass===1&&wavy&&L>12){
          const ux=dx/L,uy=dy/L,k=2*Math.PI/(WL[r.i]/LG),A=(coh?7:3)*Math.sqrt(a);
          const n=Math.max(2,Math.ceil(L/step));
          ctx.beginPath();
          for(let j=0;j<=n;j++){
            const sd=L*j/n,tp=Math.min(1,sd/8,(L-sd)/8);
            const o=A*tp*Math.sin((coh?r.ph0:r.vp0)+k*r.n*sd-k*WSPEED*time);
            const X=r.x1+ux*sd-uy*o,Y=r.y1+uy*sd+ux*o;
            if(j)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);
          }
          ctx.stroke();
        }else line(r.x1,r.y1,r.x2,r.y2);
      }
    }
    ctx.globalCompositeOperation='source-over';
  }
  for(const p of pieces){
    drawPiece(p);marks(p);
    if(p===sel){
      ctx.strokeStyle='rgba(127,214,255,.9)';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.arc(p.x,p.y,radius(p)+10,0,7);ctx.stroke();ctx.setLineDash([]);
      if(DIALS[p.t]){
        const D=DIALS[p.t],k=dialPos(p);
        ctx.strokeStyle='rgba(255,210,122,.55)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.arc(p.x,p.y,dialR(p),0,7);ctx.stroke();ctx.setLineDash([]);
        if(p.t!=='phase'){ctx.strokeStyle='rgba(255,210,122,.8)';ctx.lineWidth=2;line(2*p.x-k.x,2*p.y-k.y,k.x,k.y)}
        ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(k.x,k.y,9,0,7);ctx.fill();
        ctx.fillStyle='#ffd27a';ctx.font='600 13px system-ui,sans-serif';ctx.textAlign='center';
        ctx.fillText(dialLabel(p),p.x,p.y+radius(p)+26);
      }
      if(!p.norot){
        const h=handlePos(p);
        ctx.strokeStyle='rgba(127,214,255,.5)';line(p.x,p.y,h.x,h.y);
        ctx.fillStyle='#7fd6ff';ctx.beginPath();ctx.arc(h.x,h.y,9,0,7);ctx.fill();
      }
    }
  }
  if(guides)drawGuides();
  drawHints();
  if(lastTrace&&LV.pol){
    for(const r of lastTrace.rays){
      if(r.i!==lastTrace.minI||r.I<0.04)continue;
      const L=Math.hypot(r.x2-r.x1,r.y2-r.y1);
      if(L<130)continue;
      ctx.globalAlpha=Math.min(1,0.35+r.I);
      badge((r.x1+r.x2)/2,(r.y1+r.y2)/2,r.pol/D2R,'rgba(255,255,255,.85)',8);
      ctx.globalAlpha=1;
    }
  }
  let gi=0;
  for(const p of pieces)if(p.t==='goal'){
    const rs=lastTrace?lastTrace.res[gi]:{prog:0,pct:0,lit:false,bad:false};gi++;
    if(rs.lit){
      ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      g.addColorStop(0,bandColor(p.band||p.bands[0],0.8));g.addColorStop(1,bandColor(p.band||p.bands[0],0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
    const gb=p.band||(p.bands?[400,700]:[400,700]);
    const gcol=p.bands?'rgba(255,255,255,1)':bandColor(gb,1);
    ctx.fillStyle=rs.lit?(p.bands?'rgba(255,255,255,.95)':bandColor(gb,0.95)):'#0d1018';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    ctx.strokeStyle=rs.bad?'#ff6b6b':gcol;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
    const fill=p.show&&!p.dark?Math.min(1,rs.pct/(p.need||0.2)):rs.prog;
    if(!rs.lit&&fill>0&&!p.dark){
      ctx.strokeStyle=gcol;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+7,-Math.PI/2,-Math.PI/2+fill*Math.PI*2);ctx.stroke();
    }
    if(p.ex||p.dark){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,7);ctx.stroke()}
    if(p.show){
      let txt;
      if(p.dark)txt=rs.lit?'100%':(rs.bad?'too bright':'no light');
      else txt=Math.round((rs.lit?1:Math.min(0.99,rs.pct/(p.need||0.2)))*100)+'%';
      const below=p.y+p.r+24<=H;
      const y1=below?p.y+p.r+20:p.y-p.r-10;
      ctx.textAlign='center';ctx.font='600 14px system-ui,sans-serif';
      ctx.fillStyle=rs.lit?'#6fe3a0':(rs.bad?'#ff8a8a':'#aab3c8');
      ctx.fillText(txt,p.x,y1);
    }
  }
  ctx.restore();
}
function frame(t){
  const redraw=dirty;
  if(dirty){
    lastTrace=trace(pieces);dirty=false;
    let tl=0;for(const r of lastTrace.rays)tl+=Math.hypot(r.x2-r.x1,r.y2-r.y1);
    lastTrace.totalLen=tl;
    const all=lastTrace.res.length>0&&lastTrace.res.every(r=>r.lit);
    if(all){if(!litSince)litSince=t}else litSince=0;
  }
  if(redraw||wavy)draw(t/1000);
  if(!solved&&!sandbox&&litSince&&t-litSince>500)win();
  requestAnimationFrame(frame);
}
resize();
let start=0;
if(done.length){start=Math.min(LEVELS.length-1,Math.max(...done)+1)}
const qp=new URLSearchParams(location.search);
if(qp.get('sandbox'))sbxStart(false);
else if(qp.get('gen')){
  const [gf,gt,gs]=qp.get('gen').split(':'),lv=GEN.make(+gs||1,+gt||1,gf||undefined);
  if(lv){cur=-1;endless={tier:+gt||1,seed:+gs||1};begin(lv)}else load(start);
}else{
  if(qp.get('level'))start=Math.max(0,Math.min(LEVELS.length-1,+qp.get('level')-1));
  load(start);
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
