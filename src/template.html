<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Refract</title>
<style>
:root{--bg:#0a0c12;--panel:#12151f;--line:#262c3d;--ink:#e8ecf6;--dim:#8d96ad;--acc:#7fd6ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header,footer{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
header{justify-content:space-between}
h1{font-size:16px;font-weight:600;margin:0;text-align:center;flex:1;letter-spacing:.01em;min-width:0}
h1 small{display:block;font-weight:400;color:var(--dim);font-size:12px;line-height:1.3}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
footer{justify-content:center;min-height:58px;flex-wrap:wrap}
.grp{display:none;gap:8px;align-items:center}
.grp.on{display:flex}
#shelf{display:none;flex:none;flex-direction:column;background:#0f121b;border-top:1px solid var(--line)}
#shelf.on{display:flex}
#drawer{display:none;align-items:flex-start;gap:8px;padding:8px 12px;overflow-x:auto;background:#161a26;border-bottom:1px solid var(--line);box-shadow:inset 0 6px 10px -8px #000}
#drawer.open{display:flex}
#tabs{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;justify-content:center;flex-wrap:wrap}
#tabs .tab{position:relative;padding:6px 12px 10px;font-size:13px;min-height:34px;border-radius:8px 8px 4px 4px;white-space:nowrap}
#tabs .tab::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--line)}
#tabs .tab.on{border-color:var(--acc);background:#1b2233}
#tabs .tab.on::after{background:var(--acc)}
#tabs .tab i{font-style:normal;font-size:11px;color:var(--dim);margin-left:6px}
.item{position:relative;flex:none;display:block;text-align:center;padding:6px 8px;min-height:0;height:auto;min-width:84px;touch-action:none}
.item canvas,#ghost canvas{position:static;inset:auto;display:block;margin:0 auto 2px;width:72px;height:44px;pointer-events:none}
.item span{display:block;font-size:11px;color:var(--dim);white-space:nowrap;pointer-events:none}
.item i{position:absolute;top:3px;right:5px;font-style:normal;font-size:11px;color:var(--acc);pointer-events:none}
.item.out{opacity:.35;cursor:default}
#ghost{position:fixed;z-index:20;pointer-events:none;opacity:.85;display:none}
#selbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none;z-index:4}
#selbar .grp{pointer-events:auto;background:rgba(18,21,31,.94);border:1px solid var(--line);border-radius:12px;padding:4px 6px;flex-wrap:wrap;justify-content:center}
#selact button{padding:7px 11px;font-size:13px;min-height:36px}
#selact .del{border-color:#7a3d3d}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,12,.74);z-index:5;padding:12px}
#over.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:min(94vw,540px);width:100%;max-height:92%;overflow:auto;text-align:center}
.card h2{margin:0 0 6px;font-size:22px;font-weight:600}
.card h3{margin:14px 0 8px;font-size:14px;font-weight:600;text-align:left;color:var(--acc)}
.card p{color:var(--dim);margin:0 0 16px;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{display:flex;flex-direction:column;gap:2px;padding:8px 2px;min-width:0}
.grid b{font-size:17px;font-weight:600}
.grid span{font-size:10px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.grid .done{border-color:#3d7a57}
.grid .done b::after{content:" \2713";color:#6fe3a0;font-size:13px}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pri{background:var(--acc);color:#05202e;border-color:var(--acc);font-weight:600}
</style></head>
<body>
<header>
  <button id="bMenu" aria-label="Levels">Levels</button>
  <h1 id="title"></h1>
  <button id="bReset" aria-label="Reset level">Reset</button>
</header>
<div id="stage"><canvas id="cv"></canvas>
  <div id="selbar"><div id="selact" class="grp"></div><div id="rot" class="grp"><button id="rL" aria-label="Turn left">Turn left</button><button id="rR" aria-label="Turn right">Turn right</button></div></div>
  <div id="over"><div class="card" id="card"></div></div>
</div>
<div id="shelf"></div>
<div id="ghost"></div>
<footer>
  <button id="bHint" aria-label="Show a hint">Hint</button>
  <button id="bWave" aria-label="Toggle wave animation">Waves: on</button>
  <button id="bGuide" aria-label="Toggle guides">Guides: on</button>
  </footer>
<script>
/*ENGINE*/
/*LEVELS*/
/*GENLEVELS*/
/*GEN*/
(function(){
LEVELS.push(...GEN_LEVELS);
const GEN=makeGen({normalize,trace,WL,W,H,ZF});
const CH0=[];{let s0=0;CHAPTERS.forEach(c=>{CH0.push(s0);s0+=c.n||5})}
function chapterOf(n){let c=0;while(c+1<CH0.length&&n>=CH0[c+1])c++;return c}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let sc=1,ox=0,oy=0,dpr=1,cw=0,ch=0;
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let wavy=!reduce,guides=true;
try{if(localStorage.getItem('refract-guides')==='0')guides=false}catch(e){}
try{const v=localStorage.getItem('refract-wave');if(v==='0')wavy=false;else if(v==='1')wavy=true}catch(e){}
const WSPEED=70;
let hinted=[],cur=0,pieces=[],sel=null,mode=null,off={x:0,y:0},dirty=true,lastTrace=null,litSince=0,solved=false;
let done=[];const introSeen={};
try{done=JSON.parse(localStorage.getItem('refract-done')||'[]')}catch(e){done=[]}
function saveDone(){try{localStorage.setItem('refract-done',JSON.stringify(done))}catch(e){}}
const RGB=WL.map(wlRGB).map(c=>c.map(v=>Math.min(255,Math.round(v*0.88+28))));
let LV=LEVELS[0],endless=null,etier=1,ecount=0;
try{const e=JSON.parse(localStorage.getItem('refract-endless')||'{}');etier=e.tier||1;ecount=e.n||0}catch(e){}
function saveEndless(){try{localStorage.setItem('refract-endless',JSON.stringify({tier:etier,n:ecount}))}catch(e){}}
function begin(lv){
  LV=lv;sandbox=!!lv.sandbox;hinted=[];solved=false;litSince=0;sel=null;
  pieces=JSON.parse(JSON.stringify(lv.pieces)).map(normalize);
  $('bHint').style.display=sandbox?'none':'';
  buildShelf(lv);
  $('title').innerHTML=(sandbox?'':endless?'\u221e ':(cur+1)+'. ')+lv.name+'<small>'+lv.hint+(endless?' \u00b7 seed '+endless.seed:'')+'</small>';
  $('over').classList.remove('on');updateCtl();dirty=true;
}
function load(n){
  cur=n;endless=null;begin(LEVELS[n]);
  const c=chapterOf(n);
  if(n===CH0[c]&&c>0&&!done.includes(n)&&!introSeen[c]){
    introSeen[c]=1;
    card('<h2>Chapter '+(c+1)+': '+CHAPTERS[c].name+'</h2><p>'+CHAPTERS[c].intro+'</p><div class="row"><button class="pri" id="iOk">Got it</button></div>');
    $('iOk').onclick=()=>$('over').classList.remove('on');
  }
}
function loadEndless(tier,seed){
  etier=tier;saveEndless();
  card('<h2>Making a puzzle</h2><p>One moment.</p>');
  setTimeout(()=>{
    let lv=null,sd=seed;
    for(let k=0;k<30&&!lv;k++,sd++)lv=GEN.make(sd,tier);
    if(!lv){card('<h2>No luck</h2><p>The generator came up empty. Try again.</p><div class="row"><button class="pri" id="eAgain">Try again</button></div>');$('eAgain').onclick=()=>loadEndless(tier,Math.floor(Math.random()*1e6)+1);return}
    cur=-1;endless={tier,seed:sd-1};begin(lv);
  },30);
}
function restart(){if(sandbox)sbxStart(true);else if(endless)begin(LV);else load(cur)}
// ---- sandbox: every piece, no goal required
const RED_=[620,700],GRN_=[520,570],BLU_=[420,480];
const BANDS={
  emit:[[400,700],RED_,GRN_,BLU_,[595,605],[400,490],[560,700]],
  filter:[RED_,GRN_,BLU_,[400,490],[560,700],[400,610]],
  dichro:[[610,700],[400,490],[495,608],[400,610],[495,700]],
  goal:[[400,700],RED_,GRN_,BLU_,[595,605]]
};
const BNAME=b=>b[0]<=400&&b[1]>=700?'White':b[0]===595?'Laser':b[1]>=700&&b[0]>=600?'Red':b[0]>=500&&b[1]<=600&&b[0]<560?'Green':b[1]<=500?'Blue':'Mix';
const MK={
  emit:()=>({t:'emit',a:0,band:[400,700]}),
  mirror:()=>({t:'mirror',a:45}),
  split:()=>({t:'split',a:45}),
  prism:()=>({t:'prism',a:0}),
  orb:()=>({t:'orb'}),
  lens:()=>({t:'lens',a:90,f:160}),
  concave:()=>({t:'lens',a:90,f:-100}),
  zlens:()=>({t:'zlens',a:90}),
  filter:()=>({t:'filter',a:90,band:RED_}),
  dichro:()=>({t:'dichro',a:45,band:[610,700]}),
  pol:()=>({t:'pol',ax:0}),
  hwp:()=>({t:'hwp',ax:0}),
  pbs:()=>({t:'pbs',a:45,ax:0}),
  phase:()=>({t:'phase',ax:0}),
  wall:()=>({t:'wall',w:30,h:160,a:0}),
  bh:()=>({t:'bh',r:16}),
  goal:()=>({t:'goal',band:[400,700],r:15,show:1})
};
const FLIST=[-200,-120,-80,80,120,160,240,320];
let sandbox=false;
function sbxSave(){
  try{
    const list=pieces.map(p=>{const q=JSON.parse(JSON.stringify(p));q.a=p.a/D2R;delete q.kd;return q});
    localStorage.setItem('refract-sandbox',JSON.stringify(list));
  }catch(e){}
}
function sbxStart(fresh){
  let list=null;
  if(!fresh)try{list=JSON.parse(localStorage.getItem('refract-sandbox'))}catch(e){}
  if(!Array.isArray(list)||!list.length)list=[{t:'emit',x:110,y:300,a:0,band:[400,700]},{t:'prism',x:420,y:300,a:0}];
  cur=-1;endless=null;
  begin({name:'Sandbox',hint:'Open a drawer and take any piece, as many as you like. Drag a piece back onto the shelf to remove it.',pieces:list,sol:{},pol:1,coh:1,sandbox:1});
}
// ---- shelf: drawers of pieces to place; levels stock it with a fixed quantity
const CATS=[['light','Light',['emit','goal']],['gravity','Gravity',['bh']],['mirror','Mirrors',['mirror','split','dichro']],['glass','Glass',['prism','orb']],['lens','Lenses',['lens','zlens']],['color','Color',['filter']],['pol','Polarization',['pol','hwp','pbs']],['wave','Waves',['phase']],['wall','Walls',['wall']]];
const catOf=t=>{const c=CATS.find(c=>c[2].includes(t));return c?c[0]:'wall'};
const SB_ITEMS=['emit','goal','bh','mirror','split','dichro','prism','orb','lens','concave','zlens','filter','pol','hwp','pbs','phase','wall'];
let shelf=[],openCat=null,drag=null;
function sigOf(p){return p.t+(p.t==='lens'?p.f:'')+((p.t==='filter'||p.t==='dichro')?p.band.join('-'):'')}
function labelOf(p){
  switch(p.t){
    case 'emit':return 'Light';case 'goal':return 'Target';case 'mirror':return 'Mirror';case 'split':return 'Splitter';
    case 'dichro':return BNAME(p.band)+' dichroic';case 'prism':return 'Prism';case 'orb':return 'Glass ball';
    case 'lens':return p.f>0?'Convex '+p.f:'Concave '+(-p.f);case 'zlens':return 'Zoom lens';
    case 'filter':return BNAME(p.band)+' filter';case 'pol':return 'Polarizer';case 'hwp':return 'Waveplate';
    case 'bh':return 'Black hole';case 'pbs':return 'Pol. splitter';case 'phase':return 'Phase plate';case 'wall':return 'Wall';
  }
  return p.t;
}
const STAYS=p=>p.fixed||p.rail!==undefined||p.t==='emit'||p.t==='goal'||p.t==='wall';
function buildShelf(lv){
  shelf=[];
  if(lv.sandbox){
    for(const k of SB_ITEMS){const q=MK[k]();shelf.push({key:k,proto:q,n:Infinity,cat:catOf(q.t),label:labelOf(Object.assign({band:[400,700]},q))})}
  }else{
    const keep=[];
    pieces.forEach((p0,i)=>{
      if(STAYS(p0)){keep.push(p0);return}
      const raw=JSON.parse(JSON.stringify(lv.pieces[i]));
      delete raw.x;delete raw.y;
      const key=sigOf(p0);let it=shelf.find(i=>i.key===key);
      if(!it){it={key,proto:raw,n:0,cat:catOf(p0.t),label:labelOf(p0)};shelf.push(it)}
      it.n++;
    });
    pieces=keep;
    const order=t=>CATS.findIndex(c=>c[2].includes(t));
    shelf.sort((a,b)=>order(a.proto.t)-order(b.proto.t));
  }
  const cats=CATS.filter(c=>shelf.some(i=>i.cat===c[0]));
  if(!cats.some(c=>c[0]===openCat))openCat=cats.length?cats[0][0]:null;
  renderShelf();updSel();
}
function drawIcon(c,it){
  const g=c.getContext('2d'),q=it.proto,t=q.t,W2=72,H2=44;g.clearRect(0,0,W2,H2);g.lineCap='round';g.lineJoin='round';
  const L=(a,b,c2,d)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c2,d);g.stroke()};
  const bc=b=>{if(!b||(b[0]<=400&&b[1]>=700))return '#ffffff';const k=wlRGB((b[0]+b[1])/2);return 'rgb('+k.join(',')+')'};
  g.translate(W2/2,H2/2);
  if(t==='mirror'){g.strokeStyle='#59627f';g.lineWidth=8;L(-22,12,22,-12);g.strokeStyle='#eef3ff';g.lineWidth=3.5;L(-22,12,22,-12)}
  else if(t==='split'){g.strokeStyle='#3d6a8a';g.lineWidth=8;L(-22,12,22,-12);g.strokeStyle='#bfe6ff';g.lineWidth=3.5;g.setLineDash([6,6]);L(-22,12,22,-12);g.setLineDash([])}
  else if(t==='dichro'){g.strokeStyle='#59627f';g.lineWidth=9;L(-22,12,22,-12);g.strokeStyle=bc(q.band);g.lineWidth=5;L(-22,12,22,-12)}
  else if(t==='filter'){g.strokeStyle=bc(q.band);g.lineWidth=8;g.lineCap='butt';L(0,-17,0,17);g.strokeStyle='#fff';g.lineWidth=1.5;L(0,-17,0,17)}
  else if(t==='prism'){g.strokeStyle='rgba(205,228,255,.9)';g.fillStyle='rgba(150,200,255,.15)';g.lineWidth=2.5;g.beginPath();g.moveTo(-14,-17);g.lineTo(18,0);g.lineTo(-14,17);g.closePath();g.fill();g.stroke()}
  else if(t==='orb'){g.strokeStyle='rgba(205,228,255,.9)';g.fillStyle='rgba(150,200,255,.15)';g.lineWidth=2.5;g.beginPath();g.arc(0,0,17,0,7);g.fill();g.stroke()}
  else if(t==='lens'||t==='zlens'){
    const convex=t==='zlens'||q.f>0;g.fillStyle='rgba(150,200,255,.2)';g.strokeStyle='rgba(215,232,255,.95)';g.lineWidth=2.5;g.beginPath();
    if(convex){g.moveTo(0,-19);g.quadraticCurveTo(14,0,0,19);g.quadraticCurveTo(-14,0,0,-19)}
    else{g.moveTo(-9,-19);g.quadraticCurveTo(0,0,-9,19);g.lineTo(9,19);g.quadraticCurveTo(0,0,9,-19);g.closePath()}
    g.fill();g.stroke();
    if(t==='zlens'){g.fillStyle='#ffd27a';g.beginPath();g.arc(14,-12,4,0,7);g.fill()}
  }
  else if(t==='pol'||t==='hwp'||t==='phase'){
    const col=t==='pol'?'#c9d4f0':t==='hwp'?'#ffd27a':'#c8a6ff';
    g.fillStyle='rgba(16,20,30,.9)';g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();g.arc(0,0,16,0,7);g.fill();g.stroke();
    g.lineWidth=2;if(t==='phase'){g.fillStyle=col;g.beginPath();g.moveTo(0,0);g.arc(0,0,10,-Math.PI/2,0);g.closePath();g.fill()}else L(-10,0,10,0);
  }
  else if(t==='pbs'){g.strokeStyle='#2f5a55';g.lineWidth=9;L(-22,12,22,-12);g.strokeStyle='#9fe3d0';g.lineWidth=3.5;g.setLineDash([7,4]);L(-22,12,22,-12);g.setLineDash([])}
  else if(t==='wall'){g.fillStyle='#1a1f2e';g.strokeStyle='#3a4360';g.lineWidth=2;g.fillRect(-7,-18,14,36);g.strokeRect(-7,-18,14,36)}
  else if(t==='emit'){g.fillStyle='#161b28';g.strokeStyle='#fff';g.lineWidth=3;g.fillRect(-18,-12,26,24);g.strokeRect(-18,-12,26,24);g.fillStyle='#fff';g.beginPath();g.moveTo(10,-6);g.lineTo(19,0);g.lineTo(10,6);g.fill()}
  else if(t==='bh'){const gr=g.createRadialGradient(0,0,8,0,0,22);gr.addColorStop(0,'rgba(255,170,90,.5)');gr.addColorStop(1,'rgba(255,170,90,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,22,0,7);g.fill();g.fillStyle='#000';g.strokeStyle='rgba(255,190,120,.9)';g.lineWidth=2;g.beginPath();g.arc(0,0,9,0,7);g.fill();g.stroke()}
  else if(t==='goal'){g.fillStyle='#0d1018';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(0,0,13,0,7);g.fill();g.stroke()}
}
function renderShelf(){
  const el=$('shelf'),cats=CATS.filter(c=>shelf.some(i=>i.cat===c[0]));
  if(!cats.length){if(el.innerHTML){el.innerHTML='';el.classList.remove('on');resize()}return}
  el.classList.add('on');
  let h='<div id="drawer"'+(openCat?' class="open"':'')+'>';
  if(openCat)for(const it of shelf.filter(i=>i.cat===openCat)){
    const left=it.n===Infinity?'∞':'×'+it.n;
    h+='<button class="item'+(it.n<=0?' out':'')+'" data-key="'+it.key+'"><canvas width="144" height="88"></canvas><span>'+it.label+'</span><i>'+left+'</i></button>';
  }
  h+='</div><div id="tabs">';
  for(const [k,n] of cats){
    const left=shelf.filter(i=>i.cat===k).reduce((a,i)=>a+i.n,0);
    h+='<button class="tab'+(openCat===k?' on':'')+'" data-cat="'+k+'">'+n+(sandbox?'':'<i>'+left+'</i>')+'</button>';
  }
  el.innerHTML=h+'</div>';
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{openCat=openCat===b.dataset.cat?null:b.dataset.cat;renderShelf()});
  el.querySelectorAll('.item').forEach(b=>{
    const it=shelf.find(i=>i.key===b.dataset.key),c=b.querySelector('canvas');
    c.getContext('2d').scale(2,2);drawIcon(c,it);
    b.addEventListener('pointerdown',e=>{if(it.n<=0)return;e.preventDefault();drag={it,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId,el:b};try{b.setPointerCapture(e.pointerId)}catch(err){}});
  });
  resize();
}
function freeSpot(){
  const spots=[[500,300],[500,180],[500,420],[360,300],[640,300],[360,180],[640,420],[300,470],[700,150],[200,200],[800,300],[200,420],[800,480]];
  return spots.find(s=>!pieces.some(p=>Math.hypot(p.x-s[0],p.y-s[1])<70))||[500,300];
}
function placeItem(it,x,y){
  if(it.n<=0)return;
  const q=JSON.parse(JSON.stringify(it.proto));
  if(x===undefined){[x,y]=freeSpot()}
  q.x=Math.max(30,Math.min(W-30,Math.round(x/5)*5));q.y=Math.max(30,Math.min(H-30,Math.round(y/5)*5));
  const p=normalize(q);p.shelfKey=it.key;pieces.push(p);sel=p;
  if(it.n!==Infinity)it.n--;
  litSince=0;updateCtl();dirty=true;renderShelf();updSel();if(sandbox)sbxSave();
}
function returnPiece(p){
  const i=pieces.indexOf(p);if(i<0)return;
  pieces.splice(i,1);
  const it=shelf.find(s=>s.key===(p.shelfKey||sigOf(p)));
  if(it&&it.n!==Infinity)it.n++;
  if(sel===p)sel=null;
  litSince=0;updateCtl();dirty=true;renderShelf();updSel();if(sandbox)sbxSave();
}
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;const g=$('ghost');g.innerHTML='';const c=document.createElement('canvas');c.width=144;c.height=88;c.style.width='72px';c.style.height='44px';c.getContext('2d').scale(2,2);drawIcon(c,drag.it);g.appendChild(c);g.style.display='block';
  }
  if(drag.moved){const g=$('ghost');g.style.left=(e.clientX-36)+'px';g.style.top=(e.clientY-22)+'px'}

function unmatched(){

    if(p.t==='prism'){segsOf(p).forEach(s=>bolt(s.x1,s.y1))}
    else if(p.t==='orb'){for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;bolt(p.x+Math.cos(a)*p.r,p.y+Math.sin(a)*p.r)}}
    else if(DISC[p.t]){for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;bolt(p.x+Math.cos(a)*p.r,p.y+Math.sin(a)*p.r)}}
    else if(p.len){const s=segsOf(p)[0];bolt(s.x1,s.y1);bolt(s.x2,s.y2)}
  }else{
    ctx.fillStyle='#10141e';ctx.strokeStyle='#7fd6ff';ctx.lineWidth=2.2;
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7fd6ff';ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill();
  }
}
function drawPiece(p){
  if(p.t==='bh'){drawBH(p);return}
  if(p.t==='prism'||p.t==='orb'){
    polyPath(segsOf(p));ctx.strokeStyle='rgba(205,228,255,0.85)';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();return;
  }
  if(p.t==='lens'||p.t==='zlens'){drawLens(p);return}
  if(!p.len&&p.t!=='emit'&&!DISC[p.t])return;
  const s=p.len?segsOf(p)[0]:null;
  ctx.lineCap='round';
  if(p.t==='mirror'){
    ctx.strokeStyle='#59627f';ctx.lineWidth=9;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#eef3ff';ctx.lineWidth=4;line(s.x1,s.y1,s.x2,s.y2);
  }else if(p.t==='split'){
    ctx.strokeStyle='#3d6a8a';ctx.lineWidth=9;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#bfe6ff';ctx.lineWidth=4;ctx.setLineDash([7,7]);line(s.x1,s.y1,s.x2,s.y2);ctx.setLineDash([]);
  }else if(p.t==='filter'){
    ctx.lineCap='butt';ctx.strokeStyle=bandColor(p.band,0.9);ctx.lineWidth=8;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;line(s.x1,s.y1,s.x2,s.y2);
  }else if(p.t==='dichro'){
    ctx.strokeStyle='#59627f';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=5;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.2;line(s.x1,s.y1,s.x2,s.y2);
  }else if(DISC[p.t]){
    drawDisc(p);
  }else if(p.t==='pbs'){
    ctx.strokeStyle='#2f5a55';ctx.lineWidth=10;line(s.x1,s.y1,s.x2,s.y2);
    ctx.strokeStyle='#9fe3d0';ctx.lineWidth=4;ctx.setLineDash([9,5]);line(s.x1,s.y1,s.x2,s.y2);ctx.setLineDash([]);
    badge(p.x,p.y,p.ax,'#9fe3d0');
  }else if(p.t==='emit'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.fillStyle='#161b28';ctx.strokeStyle=bandColor(p.band,1);ctx.lineWidth=3;
    ctx.beginPath();ctx.rect(-14,-12,26,24);ctx.fill();ctx.stroke();
    ctx.fillStyle=bandColor(p.band,1);ctx.beginPath();ctx.moveTo(12,-6);ctx.lineTo(20,0);ctx.lineTo(12,6);ctx.fill();
    ctx.restore();
    if(LV.pol)badge(p.x,p.y-26,p.pol,'#ffffff',9);
  }
}
function draw(time){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
  ctx.fillStyle='#0d1018';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1b2132';
  for(let x=50;x<W;x+=50)for(let y=50;y<H;y+=50)ctx.fillRect(x-1,y-1,2,2);
  ctx.strokeStyle='#262c3d';ctx.lineWidth=2;ctx.strokeRect(0,0,W,H);
  for(const p of pieces)if(p.rail!==undefined){
    const r=p.rail*D2R,c=Math.cos(r),s=Math.sin(r);
    ctx.strokeStyle='rgba(127,214,255,.28)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
    line(p.ox-c*p.range,p.oy-s*p.range,p.ox+c*p.range,p.oy+s*p.range);ctx.setLineDash([]);
  }
  for(const p of pieces)if(p.t==='wall'){
    polyPath(segsOf(p));ctx.fillStyle='#1a1f2e';ctx.fill();ctx.strokeStyle='#3a4360';ctx.lineWidth=2;ctx.stroke();
  }
  for(const p of pieces)if(p.t==='prism'||p.t==='orb'){polyPath(segsOf(p));ctx.fillStyle='rgba(150,200,255,0.10)';ctx.fill()}
  if(lastTrace){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    const step=Math.max(6,(lastTrace.totalLen||0)/5000),coh=!!LV.coh;
    for(const pass of [0,1]){
      for(const r of lastTrace.rays){
        const c=RGB[r.i],a=Math.min(1,r.I*r.K);
        ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(pass?0.5*a:0.07*a)+')';
        ctx.lineWidth=pass?2.2:8;
        const dx=r.x2-r.x1,dy=r.y2-r.y1,L=Math.hypot(dx,dy);
        if(pass===1&&wavy&&L>12){
          const ux=dx/L,uy=dy/L,k=2*Math.PI/(WL[r.i]/LG),A=(coh?7:3)*Math.sqrt(a);
          const n=Math.max(2,Math.ceil(L/step));
          ctx.beginPath();
          for(let j=0;j<=n;j++){
            const sd=L*j/n,tp=Math.min(1,sd/8,(L-sd)/8);
            const o=A*tp*Math.sin((coh?r.ph0:r.vp0)+k*r.n*sd-k*WSPEED*time);
            const X=r.x1+ux*sd-uy*o,Y=r.y1+uy*sd+ux*o;
            if(j)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);
          }
          ctx.stroke();
        }else line(r.x1,r.y1,r.x2,r.y2);
      }
    }
    ctx.globalCompositeOperation='source-over';
  }
  for(const p of pieces){
    drawPiece(p);marks(p);
    if(p===sel){
      ctx.strokeStyle='rgba(127,214,255,.9)';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.arc(p.x,p.y,radius(p)+10,0,7);ctx.stroke();ctx.setLineDash([]);
      if(DIALS[p.t]){
        const D=DIALS[p.t],k=dialPos(p);
        ctx.strokeStyle='rgba(255,210,122,.55)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.arc(p.x,p.y,dialR(p),0,7);ctx.stroke();ctx.setLineDash([]);
        if(p.t!=='phase'){ctx.strokeStyle='rgba(255,210,122,.8)';ctx.lineWidth=2;line(2*p.x-k.x,2*p.y-k.y,k.x,k.y)}
        ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(k.x,k.y,9,0,7);ctx.fill();
        ctx.fillStyle='#ffd27a';ctx.font='600 13px system-ui,sans-serif';ctx.textAlign='center';
        ctx.fillText(dialLabel(p),p.x,p.y+radius(p)+26);
      }
      if(p.t==='bh'&&!p.fixed){
        ctx.strokeStyle='rgba(255,210,122,.7)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(p.x+p.r,p.y,9,0,7);ctx.fill();
        ctx.font='600 13px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Size '+p.r,p.x,p.y+p.r*1.5+24);
      }
      if(!p.norot){
        const h=handlePos(p);
        ctx.strokeStyle='rgba(127,214,255,.5)';line(p.x,p.y,h.x,h.y);
        ctx.fillStyle='#7fd6ff';ctx.beginPath();ctx.arc(h.x,h.y,9,0,7);ctx.fill();
      }
    }
  }
  if(guides)drawGuides();
  drawHints();
  if(lastTrace&&LV.pol){
    for(const r of lastTrace.rays){
      if(r.i!==lastTrace.minI||r.I<0.04)continue;
      const L=Math.hypot(r.x2-r.x1,r.y2-r.y1);
      if(L<130)continue;
      ctx.globalAlpha=Math.min(1,0.35+r.I);
      badge((r.x1+r.x2)/2,(r.y1+r.y2)/2,r.pol/D2R,'rgba(255,255,255,.85)',8);
      ctx.globalAlpha=1;
    }
  }
  let gi=0;
  for(const p of pieces)if(p.t==='goal'){
    const rs=lastTrace?lastTrace.res[gi]:{prog:0,pct:0,lit:false,bad:false};gi++;
    if(rs.lit){
      ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      g.addColorStop(0,bandColor(p.band||p.bands[0],0.8));g.addColorStop(1,bandColor(p.band||p.bands[0],0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
    const gb=p.band||(p.bands?[400,700]:[400,700]);
    const gcol=p.bands?'rgba(255,255,255,1)':bandColor(gb,1);
    ctx.fillStyle=rs.lit?(p.bands?'rgba(255,255,255,.95)':bandColor(gb,0.95)):'#0d1018';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    ctx.strokeStyle=rs.bad?'#ff6b6b':gcol;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
    const fill=p.show&&!p.dark?Math.min(1,rs.pct/(p.need||0.2)):rs.prog;
    if(!rs.lit&&fill>0&&!p.dark){
      ctx.strokeStyle=gcol;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+7,-Math.PI/2,-Math.PI/2+fill*Math.PI*2);ctx.stroke();
    }
    if(p.ex||p.dark){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,7);ctx.stroke()}
    if(p.show){
      let txt;
      if(p.dark)txt=rs.lit?'100%':(rs.bad?'too bright':'no light');
      else txt=Math.round((rs.lit?1:Math.min(0.99,rs.pct/(p.need||0.2)))*100)+'%';
      const below=p.y+p.r+24<=H;
      const y1=below?p.y+p.r+20:p.y-p.r-10;
      ctx.textAlign='center';ctx.font='600 14px system-ui,sans-serif';
      ctx.fillStyle=rs.lit?'#6fe3a0':(rs.bad?'#ff8a8a':'#aab3c8');
      ctx.fillText(txt,p.x,y1);
    }
  }
  ctx.restore();
}
function frame(t){
  const redraw=dirty;
  if(dirty){
    lastTrace=trace(pieces);dirty=false;
    let tl=0;for(const r of lastTrace.rays)tl+=Math.hypot(r.x2-r.x1,r.y2-r.y1);
    lastTrace.totalLen=tl;
    const all=lastTrace.res.length>0&&lastTrace.res.every(r=>r.lit);
    if(all){if(!litSince)litSince=t}else litSince=0;
  }
  if(redraw||wavy)draw(t/1000);
  if(!solved&&!sandbox&&litSince&&t-litSince>500)win();
  requestAnimationFrame(frame);
}
resize();
let start=0;
if(done.length){start=Math.min(LEVELS.length-1,Math.max(...done)+1)}
const qp=new URLSearchParams(location.search);
if(qp.get('sandbox'))sbxStart(false);
else if(qp.get('gen')){
  const [gf,gt,gs]=qp.get('gen').split(':'),lv=GEN.make(+gs||1,+gt||1,gf||undefined);
  if(lv){cur=-1;endless={tier:+gt||1,seed:+gs||1};begin(lv)}else load(start);
}else{
  if(qp.get('level'))start=Math.max(0,Math.min(LEVELS.length-1,+qp.get('level')-1));
  load(start);
}
requestAnimationFrame(frame);
})();
</script>
